<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>היום שלי · כל המסכים</title>
<style>
  :root{
    --bg:#f6f5f3; --ink:#1c1b19; --mute:#6b6862; --line:#e0ddd7;
    --card:#fff; --chen:#7c5cff; --agent:#9a958c; --warn:#b4472f;
    --warn-bg:#fdf1ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"SF Hebrew","Heebo","Assistant",system-ui,sans-serif;
    font-size:16px;line-height:1.65;}
  header{padding:40px 24px 28px;max-width:1100px;margin:0 auto}
  h1{font-size:30px;margin:0 0 8px;letter-spacing:-.02em}
  .lede{color:var(--mute);max-width:60ch;margin:0}
  .toc{max-width:1100px;margin:0 auto;padding:0 24px 32px;
    display:flex;flex-wrap:wrap;gap:8px}
  .toc a{font-size:14px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:5px 13px}
  .toc a:hover{border-color:var(--chen)}
  main{max-width:1100px;margin:0 auto;padding:0 24px 120px}
  section{margin:0 0 12px}
  .sec-h{position:sticky;top:0;background:var(--bg);
    padding:26px 0 12px;border-bottom:1px solid var(--line);
    margin-bottom:28px;z-index:5}
  .sec-h h2{margin:0;font-size:22px;letter-spacing:-.01em}
  .sec-h p{margin:4px 0 0;color:var(--mute);font-size:14px}

  .screen{background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:22px;margin-bottom:22px}
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .num{color:var(--mute);font-variant-numeric:tabular-nums;font-size:14px}
  .name{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .badge{font-size:12px;padding:2px 9px;border-radius:999px;
    border:1px solid;line-height:1.6}
  .badge.chen{color:var(--chen);border-color:var(--chen);background:#f3f0ff}
  .badge.agent{color:var(--agent);border-color:var(--line)}
  .file{color:var(--mute);font-size:13px;font-family:ui-monospace,Menlo,monospace}

  .why{margin:10px 0 2px;font-size:17px}
  .what{margin:0 0 16px;color:var(--mute);font-size:15px}
  .note{margin:0 0 16px;padding:11px 14px;border-radius:10px;
    background:var(--warn-bg);border:1px solid #f0d5cc;
    color:#7a3020;font-size:14.5px}
  .note b{color:var(--warn)}

  .panes{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .pane{flex:0 0 auto}
  .pane-t{font-size:13px;color:var(--mute);margin-bottom:6px;
    display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .dot.chen{background:var(--chen)} .dot.agent{background:var(--agent)}
  .frame{width:390px;height:844px;border:1px solid var(--line);
    border-radius:22px;overflow:hidden;background:#fff}
  iframe{width:390px;height:844px;border:0;display:block}
  .pane img{width:390px;border:1px solid var(--line);
    border-radius:22px;display:block;background:#fff}
  .missing{width:390px;height:180px;border:1px dashed var(--line);
    border-radius:22px;display:flex;align-items:center;justify-content:center;
    color:var(--mute);font-size:14px;text-align:center;padding:20px}

  .orphans{display:flex;gap:18px;flex-wrap:wrap}
  .orphans figure{margin:0}
  .orphans figcaption{font-size:13px;color:var(--mute);margin-top:6px}

  @media (max-width:900px){
    .frame,iframe,.pane img,.missing{width:340px}
    .frame,iframe{height:736px}
  }
</style>
</head>
<body>

<header>
  <h1>היום שלי · כל המסכים</h1>
  <p class="lede">
    כל מסך חי ורץ, ומתחתיו מה הוא עושה ומה כתוב בו.
    ארגז אדום מסמן סתירה אמיתית בין שני מסכים.
    סדר המסכים הוא סדר הפלאוו מ־<code>plans/MAP.md</code>.
  </p>
</header>

<nav class="toc" id="toc"></nav>
<main id="app"></main>

<script src="screens.js"></script>
<script>
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function pane(title, kind, inner){
  return `<div class="pane">
    <div class="pane-t"><span class="dot ${kind}"></span>${title}</div>
    ${inner}</div>`;
}

function screenBlock(s){
  const panes = [];
  // צילומי הטסט מגרסת הקוד הישנה הוסרו מהתצוגה 31.7. הם לא קשורים לעיצוב.
  // הקבצים עצמם נשארים ב-design/_archive-old-mockups/.
  if (s.built) panes.push(pane('המסך', 'chen',
    `<div class="frame"><iframe data-src="design/${enc(s.built)}"></iframe></div>`));

  return `<article class="screen" id="s-${s.id}">
    <div class="head">
      <span class="num">${s.n}</span>
      <span class="name">${esc(s.name)}</span>
      <span class="badge ${s.tag === 'חן' ? 'chen' : 'agent'}">${s.tag}</span>
      <span class="file">${esc(s.built || '')}</span>
    </div>
    ${s.why  ? `<p class="why">${esc(s.why)}</p>` : ''}
    ${s.what ? `<p class="what">${esc(s.what)}</p>` : ''}
    ${s.note ? `<div class="note"><b>סתירה פתוחה.</b> ${esc(s.note)}</div>` : ''}
    <div class="panes">${panes.join('')}</div>
  </article>`;
}

document.getElementById('app').innerHTML = SECTIONS.map((sec, i) => `
  <section id="sec-${i}">
    <div class="sec-h"><h2>${esc(sec.title)}</h2>
      ${sec.sub ? `<p>${esc(sec.sub)}</p>` : ''}</div>
    ${sec.screens.map(screenBlock).join('')}
  </section>`).join('');

// 47 מסגרות חיות בבת אחת מקפיאות את הדפדפן.
// נטענת רק מה שקרוב למסך, ומתפנה כשמתרחקים.
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    const f = e.target;
    if (e.isIntersecting) { if (!f.src) f.src = f.dataset.src; }
    else if (f.src) f.removeAttribute('src');
  }
}, { rootMargin: '1200px 0px' });
document.querySelectorAll('iframe[data-src]').forEach(f => io.observe(f));

document.getElementById('toc').innerHTML =
  SECTIONS.map((s, i) => `<a href="#sec-${i}">${esc(s.title)}</a>`).join('');
</script>
</body>
</html>
