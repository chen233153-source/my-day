<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שורת הטאבים · שלוש אפשרויות</title>
<style>
  body{margin:0;background:#f6f5f3;color:#1c1b19;
    font-family:-apple-system,"Assistant","Heebo",system-ui,sans-serif;padding:32px}
  h1{font-size:26px;margin:0 0 6px}
  p.lede{color:#6b6862;margin:0 0 28px;max-width:60ch}
  .row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figcaption{margin-top:10px;font-size:15px;font-weight:600}
  .sub{font-size:13.5px;color:#6b6862;max-width:390px;margin-top:2px;line-height:1.55}
  iframe{width:390px;height:844px;border:1px solid #e0ddd7;border-radius:22px;
    display:block;background:#fff}
</style>
</head>
<body>
<h1>שורת הטאבים · שלוש אפשרויות</h1>
<p class="lede">אותו מסך בדיוק, <code>today-day</code>, רק שורת הטאבים משתנה.
בשלושתן: רקע בעולמות הסגול, אפקט זכוכית, ועיגול הצ׳אט יוצא מעל המסגרת של השורה.</p>

<div class="row">
  <figure>
    <iframe src="v1.html"></iframe>
    <figcaption>1 · זכוכית צפה</figcaption>
    <div class="sub">גלולה מרוחפת עם מרווח מכל הצדדים. זכוכית בהירה עם שפה עליונה מוארת.
      העיגול לבן, עם הילה סגולה רכה סביבו.</div>
  </figure>

  <figure>
    <iframe src="v2.html"></iframe>
    <figcaption>2 · זכוכית ברוחב מלא</figcaption>
    <div class="sub">נוגעת בשוליים, פינות עליונות מעוגלות. זכוכית שמתחילה בהירה למעלה
      ונהיית סגולה למטה. העיגול בולט הכי הרבה מהשלושה.</div>
  </figure>

  <figure>
    <iframe src="v3.html"></iframe>
    <figcaption>3 · זכוכית סגולה כהה</figcaption>
    <div class="sub">אותה גלולה מרוחפת, אבל בסגול עמוק. הכי הרבה ניגודיות מול הרקע.
      העיגול עם זוהר סגול, לא רק צל.</div>
  </figure>
</div>
</body>
</html>
