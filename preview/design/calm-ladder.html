<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - הסולם הרגשי</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<!-- 22 · רגיעה, הסולם הרגשי. גיליון תחתון מעל רגע הפעולה.
     שבע המדרגות הראשונות. יציאה: סגרי.
     שורות דקות ולא .choice-card: שבעה כרטיסים בגובה 84px חורגים מגובה המסך. -->
<main class="phone" data-od-id="calm-ladder-screen">

  <!-- ההקשר שמתחת: רגע הפעולה, מעומעם ולא אינטראקטיבי -->
  <section class="content" data-od-id="action-context" inert aria-hidden="true">
    <div class="top-bar" data-od-id="context-top-bar">
      <span class="step-label">המשימה שלך עכשיו</span>
    </div>
    <div class="white-card" data-od-id="context-task">
      <strong>לענות לשלוש פניות מהדיירקט</strong>
      <p>20 דקות על הטיימר</p>
    </div>
    <div class="scroll center" data-od-id="context-countdown">
      <div class="breath-circle"><span dir="ltr">5 · 4 · 3 · 2 · 1</span></div>
    </div>
  </section>

  <aside class="sheet" data-od-id="calm-ladder-sheet">
    <h1 data-od-id="sheet-title">הסולם הרגשי</h1>
    <p>אתרי איפה את באמת, והושיטי יד למחשבה שמרגישה מעט יותר טוב. מדרגה אחת, לא קפיצה לפסגה.</p>

    <div class="cards" data-od-id="ladder-rungs">
      <div class="pill-row"><button class="pill" data-od-id="rung-1">1 שמחה, הערכה, אהבה</button></div>
      <div class="pill-row"><button class="pill" data-od-id="rung-2">2 תשוקה</button></div>
      <div class="pill-row"><button class="pill" data-od-id="rung-3">3 התלהבות, אושר</button></div>
      <div class="pill-row"><button class="pill" data-od-id="rung-4">4 ציפייה חיובית, אמונה</button></div>
      <div class="pill-row"><button class="pill" data-od-id="rung-5">5 אופטימיות</button></div>
      <div class="pill-row"><button class="pill" data-od-id="rung-6">6 תקווה</button></div>
      <div class="pill-row"><button class="pill" data-od-id="rung-7">7 שביעות רצון</button></div>
    </div>

    <p class="text-link" role="button" tabindex="0" data-od-id="close" data-target="calm-tools.html">סגרי</p>

    <p class="fine-print" data-od-id="sources">Ask and It Is Given · Abraham-Hicks</p>
  </aside>
</main>
<script>
  document.querySelectorAll('[data-target]').forEach(function (el) {
    el.addEventListener('click', function () { location.href = el.dataset.target; });
  });
</script>
</body>
</html>
