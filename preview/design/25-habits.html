<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - קולות להרגל</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="habit-voices-screen">
  <section class="content with-tabs">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">ההרגל שלי</span>
      <button class="back-btn" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>

    <header class="heading" data-od-id="habit-heading">
      <h1 data-od-id="screen-title"><bdi>163</bdi> קולות ל״אני אדם שקורא״</h1>
      <p class="subtitle">כל פעם שעשית, זה קול.</p>
    </header>

    <section class="cards" data-od-id="voices-layout">
      <div class="white-card" data-od-id="voices-grid-card">
        <strong>הקולות שלך</strong>
        <div class="voice-grid" aria-label="קולות לאורך השבועות">
          <span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot"></span><span class="voice-dot on"></span><span class="voice-dot on"></span>
          <span class="voice-dot on"></span><span class="voice-dot"></span><span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot"></span><span class="voice-dot on"></span>
          <span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot"></span><span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot"></span>
          <span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot"></span><span class="voice-dot on"></span><span class="voice-dot on"></span><span class="voice-dot on"></span>
        </div>
      </div>

      <div class="choice-card selected" data-od-id="agreement-card">
        <span class="radio"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
        <span class="card-text"><strong>אחרי שאמזוג קפה בבוקר</strong><span>אני אקרא עמוד אחד ואז אגיד ״יש״</span></span>
        <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8 14a6 6 0 118 0c-1 1-1 2-1 3H9c0-1 0-2-1-3z"/></svg></span>
      </div>

      <div class="choice-card" data-od-id="growth-prompt">
        <span class="radio"></span>
        <span class="card-text"><strong>נראה שזה כבר קורה מעצמו. להגדיל?</strong><span>עמוד אחד ← שלושה עמודים. או להישאר בדיוק כאן.</span></span>
        <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 18c5-1 8-4 9-9"/><path d="M13 9h5v5"/></svg></span>
      </div>
    </section>

  </section>

  <nav class="tab-bar" data-od-id="tab-bar">
    <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-4 6-2-3"/></svg><span>המצפן</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/></svg><span>משימות</span></button>
    <button class="fab" aria-label="שיחה"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 01-4 4H8l-5 3V7a4 4 0 014-4h10a4 4 0 014 4z"/></svg></button>
    <button class="tab active"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8 14a6 6 0 118 0c-1 1-1 2-1 3H9c0-1 0-2-1-3z"/></svg><span>הרגלים</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>היום שלי</span></button>
  </nav>
</main>
</body>
</html>
