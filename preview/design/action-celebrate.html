<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - חגיגה</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="action-celebrate-screen">
  <section class="content">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">רגע הפעולה</span>
    </div>

    <header class="heading" data-od-id="celebrate-heading">
      <h1 data-od-id="screen-title">בלוק שלם!</h1>
    </header>

    <div class="scroll center" data-od-id="celebrate-body">
      <div class="hero-card" data-od-id="weekly-blocks">
        <strong><bdi>4</bdi> בלוקים השבוע</strong>
        <p></p>
      </div>

      <p class="subtitle" data-od-id="break-line">עכשיו הפסקה.</p>

      <div class="pill-row" data-od-id="break-options">
        <button class="pill" data-od-id="break-outside">לצאת החוצה</button>
        <button class="pill" data-od-id="break-eat">משהו לאכול</button>
        <button class="pill" data-od-id="break-nothing">פשוט לשבת</button>
      </div>

      <!-- 1.10 · לא הייתה שום יציאה מהמסך, וזו נקודת נטישה בסוף עבודה מרוכזת. 30.7 -->
      <div class="bottom" data-od-id="celebrate-exit">
        <button class="cta" onclick="location.href='07-now-action.html'">לחזור למשימה הבאה</button>
        <button class="cta secondary" onclick="location.href='today-day.html'">מספיק להיום</button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
