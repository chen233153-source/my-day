<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - מטרות ל־12 שבועות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-lg: 24px;
    --radius-pill: 999px;
    --font: 'Assistant', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background:
      radial-gradient(ellipse at 28% 12%, color-mix(in oklch, var(--accent) 18%, transparent), transparent 34%), var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 390px;
    height: 844px;
    position: relative;
    overflow: hidden;
    border-radius: 44px;
    background:
      radial-gradient(ellipse at 20% 8%, color-mix(in oklch, var(--surface) 20%, transparent), transparent 32%),
    radial-gradient(ellipse at 92% 80%, color-mix(in oklch, var(--bg) 42%, transparent), transparent 42%),
    linear-gradient(180deg, color-mix(in oklch, var(--fg) 30%, var(--accent)) 0%, var(--accent) 42%, var(--accent) 72%, color-mix(in oklch, var(--accent) 62%, var(--bg)) 88%, var(--bg) 108%);
    box-shadow: 0 40px 80px color-mix(in oklch, var(--fg) 22%, transparent),
    0 8px 24px color-mix(in oklch, var(--fg) 18%, transparent);
  }
  /* רקע אחיד לכל האפליקציה, זהה ל-habit-flow.css. 30.7 */
  .phone:before {
    content: "";
    position: absolute;
    inset: 250px auto auto -80px;
    width: 470px;
    height: 470px;
    border: 1px solid color-mix(in oklch, var(--surface) 9%, transparent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }


  .glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(80px);
  }
  .glow-1 { width: 260px; height: 260px; background: color-mix(in oklch, var(--surface) 28%, transparent); top: -48px; right: -64px }
  .glow-2 { width: 210px; height: 210px; background: color-mix(in oklch, var(--accent-secondary) 18%, transparent); bottom: 76px; left: -64px }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid color-mix(in oklch, var(--surface) 8%, transparent);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .ring-1 { width: 480px; height: 480px }
  .ring-2 { width: 336px; height: 336px; border-color: color-mix(in oklch, var(--surface) 5%, transparent) }

  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 78px 32px 56px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
  }

  .back-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid color-mix(in oklch, var(--surface) 15%, transparent);
    background: color-mix(in oklch, var(--surface) 10%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s cubic-bezier(.2,0,0,1), opacity .15s cubic-bezier(.2,0,0,1);
  }
  .back-btn:active { transform: translateY(1px) scale(.985); opacity: .9 }
  .back-btn svg { width: 20px; height: 20px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

  .step-label {
    color: color-mix(in oklch, var(--surface) 58%, transparent);
    font-size: 14px;
    font-weight: 600;
  }

  .heading-area { margin-bottom: 20px }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 30px;
    padding: 5px 11px;
    border-radius: var(--radius-pill);
    background: color-mix(in oklch, var(--surface) 12%, transparent);
    border: 1px solid color-mix(in oklch, var(--surface) 16%, transparent);
    color: color-mix(in oklch, var(--surface) 72%, transparent);
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .eyebrow span {
    font-family: var(--mono);
    color: var(--accent-secondary);
    font-size: 12px;
  }

  h1 {
    max-width: 320px;
    color: var(--surface);
    font-size: 29px;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }

  .subtitle {
    max-width: 310px;
    color: color-mix(in oklch, var(--surface) 62%, transparent);
    font-size: 15px;
    line-height: 1.55;
    font-weight: 500;
  }

  .principle {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: color-mix(in oklch, var(--accent-secondary) 42%, var(--surface));
    color: var(--fg);
    box-shadow: inset 0 1px 0 color-mix(in oklch, var(--surface) 24%, transparent);
    margin-bottom: 14px;
  }
  .principle-number {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in oklch, var(--surface) 58%, transparent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 800;
    direction: ltr;
  }
  .principle p {
    font-size: 13px;
    line-height: 1.45;
    font-weight: 700;
  }

  /* ד6 · הכרטיס תפס את כל הגובה הפנוי, ולכן רשימה עם מטרה אחת השאירה
     בתוכו 211px של לבן ריק. הגובה נגזר מהתוכן, ועדיין מתכווץ וגולל
     כשיש שלוש מטרות. 31.7 */
  .goals-card {
    flex: 0 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: var(--radius-lg);
    background: color-mix(in oklch, var(--surface) 94%, var(--bg));
    border: 1px solid color-mix(in oklch, var(--surface) 24%, transparent);
    box-shadow: 0 18px 32px color-mix(in oklch, var(--fg) 14%, transparent), inset 0 1px 0 color-mix(in oklch, var(--surface) 36%, transparent);
  }

  .card-head {
    padding: 17px 18px 13px;
    border-bottom: 1px solid var(--border);
  }
  .card-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--fg);
    margin-bottom: 4px;
  }
  .card-hint {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    line-height: 1.45;
  }

  .goal-list {
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 2px 18px 0;
  }
  .goal-list::-webkit-scrollbar { display: none }

  .goal-row {
    display: grid;
    grid-template-columns: 34px 1fr 36px;
    gap: 10px;
    align-items: start;
    padding: 14px 0;
    border-bottom: 1px solid color-mix(in oklch, var(--border) 78%, transparent);
  }
  .goal-row:last-child { border-bottom: none }

  .goal-number {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent-secondary);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 800;
    direction: ltr;
    margin-top: 2px;
  }

  .goal-input {
    width: 100%;
    min-height: 34px;
    max-height: 90px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.45;
    padding: 4px 0;
  }
  .goal-input::placeholder { color: color-mix(in oklch, var(--muted) 68%, transparent) }

  .delete-btn {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: .82;
    transition: background .15s cubic-bezier(.2,0,0,1), transform .15s cubic-bezier(.2,0,0,1), opacity .15s cubic-bezier(.2,0,0,1);
  }
  .delete-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  .delete-btn:disabled { visibility: hidden }
  .delete-btn:active { transform: translateY(1px) scale(.985); opacity: .7 }
  .delete-btn:hover { background: color-mix(in oklch, var(--bg) 58%, transparent) }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px 16px;
    border-top: 1px solid color-mix(in oklch, var(--border) 68%, transparent);
  }

  .add-goal {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 0;
    border-radius: var(--radius-pill);
    background: color-mix(in oklch, var(--accent-secondary) 24%, var(--surface));
    color: var(--fg);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 800;
    padding: 0 16px;
    cursor: pointer;
    transition: transform .15s cubic-bezier(.2,0,0,1), opacity .15s cubic-bezier(.2,0,0,1);
  }
  .add-goal svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round }
  .add-goal:disabled { opacity: .42; cursor: default }
  .add-goal:active:not(:disabled) { transform: translateY(1px) scale(.985); opacity: .9 }

  .limit-note {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .bottom {
    margin-top: auto;   /* ד6 · הכפתור נשאר נעוץ בתחתית אחרי שהכרטיס הפסיק למתוח */
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-top: 16px;
  }

  .dots { display: flex; gap: 8px; justify-content: center }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in oklch, var(--surface) 22%, transparent) }
  .dot.done { background: color-mix(in oklch, var(--surface) 42%, transparent) }
  .dot.active { width: 24px; border-radius: var(--radius-pill); background: var(--surface) }

  .cta {
    width: 100%;
    height: 56px;
    border: 0;
    border-radius: var(--radius);
    background: var(--accent-secondary);
    color: var(--fg);
    font-family: var(--font);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 16px 28px color-mix(in oklch, var(--fg) 14%, transparent);
    transition: transform .15s cubic-bezier(.2,0,0,1), opacity .15s cubic-bezier(.2,0,0,1);
  }
  .cta:active { transform: translateY(1px) scale(.985); opacity: .9 }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>

  <div class="content">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">3 מתוך 6</span>
      <button class="back-btn" type="button" aria-label="חזרה" data-od-id="back-button">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <section class="heading-area" data-od-id="goals-heading">
      <div class="eyebrow" data-od-id="goals-method-label"><span><bdi>12</bdi></span> שבועות קדימה</div>
      <h1>מה את רוצה שיזוז עכשיו?</h1>
      <p class="subtitle">אחת עד שלוש. אחר כך נוריד כל אחת לשבוע הזה.</p>
    </section>

    <div class="principle" data-od-id="goals-principle">
      <p>תכנון מושלם לא מזיז כלום. שבוע אחד כן.</p>
    </div>

    <section class="goals-card" data-od-id="goals-editor">
      <div class="card-head">
        <h2 class="card-title">המטרות ל־12 השבועות</h2>
        <p class="card-hint">כל מטרה במשפט אחד.</p>
      </div>

      <div class="goal-list" id="goal-list" data-od-id="goals-list"></div>

      <div class="card-foot">
        <button class="add-goal" id="add-goal" type="button" data-od-id="add-goal-button">
          <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          להוסיף מטרה
        </button>
        <span class="limit-note" id="limit-note">עד 3</span>
      </div>
    </section>

    <div class="bottom" data-od-id="goals-cta-area">
      <div class="dots" data-od-id="step-dots">
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <button class="cta" type="button" data-od-id="continue-button">הלאה</button>
    </div>

    <div class="sr-only" id="save-state" aria-live="polite" data-od-id="goals-autosave-state"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'myday.onboarding.goals.v1';
const MAX_GOALS = 3;
const DEFAULT_GOALS = [''];
const list = document.getElementById('goal-list');
const addButton = document.getElementById('add-goal');
const limitNote = document.getElementById('limit-note');
const saveState = document.getElementById('save-state');

let goals = loadGoals();
let saveTimer = null;

function loadGoals() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (Array.isArray(saved) && saved.length) {
      return saved.slice(0, MAX_GOALS).map(value => String(value || ''));
    }
  } catch (error) {}
  return [...DEFAULT_GOALS];
}

function iconTrash() {
  return '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6.5 7l.7 13h9.6l.7-13"/><path d="M9 7V4.8h6V7"/></svg>';
}

function autosize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = `${textarea.scrollHeight}px`;
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
    saveState.textContent = 'נשמר';
  }, 220);
}

function focusGoal(index) {
  requestAnimationFrame(() => {
    const field = list.querySelector(`[data-index="${index}"] textarea`);
    if (field) {
      field.focus();
      field.selectionStart = field.value.length;
      field.selectionEnd = field.value.length;
    }
  });
}

function addGoal(afterIndex = goals.length - 1) {
  if (goals.length >= MAX_GOALS) return;
  goals.splice(afterIndex + 1, 0, '');
  render();
  scheduleSave();
  focusGoal(afterIndex + 1);
}

function removeGoal(index) {
  if (goals.length === 1) return;
  goals.splice(index, 1);
  render();
  scheduleSave();
  focusGoal(Math.max(0, index - 1));
}

function render() {
  list.innerHTML = goals.map((goal, index) => {
    const removable = goals.length > 1;
    const placeholder = index === 0 ? 'לדוגמה: לסיים פרויקט חשוב' : 'עוד מטרה שחשובה עכשיו';
    return `
      <div class="goal-row" data-index="${index}" data-od-id="goal-row-${index + 1}">
        <div class="goal-number">${index + 1}</div>
        <textarea class="goal-input" rows="1" data-index="${index}" placeholder="${placeholder}" aria-label="מטרה ${index + 1}">${goal}</textarea>
        <button class="delete-btn" type="button" aria-label="מחיקת מטרה" data-delete="${index}" ${removable ? '' : 'disabled'}>${iconTrash()}</button>
      </div>
    `;
  }).join('');

  list.querySelectorAll('textarea').forEach(textarea => {
    autosize(textarea);
    textarea.addEventListener('input', event => {
      const index = Number(event.currentTarget.dataset.index);
      goals[index] = event.currentTarget.value;
      autosize(event.currentTarget);
      scheduleSave();
    });
    textarea.addEventListener('keydown', event => {
      const index = Number(event.currentTarget.dataset.index);
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (index === goals.length - 1 && goals[index].trim() && goals.length < MAX_GOALS) {
          addGoal(index);
        } else {
          focusGoal(Math.min(index + 1, goals.length - 1));
        }
      }
      if (event.key === 'Backspace' && !event.currentTarget.value && goals.length > 1) {
        event.preventDefault();
        removeGoal(index);
      }
    });
  });

  list.querySelectorAll('[data-delete]').forEach(button => {
    button.addEventListener('click', event => {
      removeGoal(Number(event.currentTarget.dataset.delete));
    });
  });

  addButton.disabled = goals.length >= MAX_GOALS;
  limitNote.textContent = goals.length >= MAX_GOALS ? 'מקסימום 3' : `${goals.length}/3`;
}

addButton.addEventListener('click', () => addGoal(goals.length - 1));
render();
</script>
</body>
</html>
