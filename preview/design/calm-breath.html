<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - נשימה</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<!--
  20 · רגיעה, נשימה. בעיצוב של חן זה מסך מלא ולא גיליון: אין כרטיס משימה,
  אין ספירה לאחור מאחור, ואין שורה עליונה. רק ההנחיה, העיגול, והמונה.
  אין טיימר ואין CTA ירוק. היציאה היא "סיימתי".
-->
<main class="phone" data-od-id="calm-breath-screen">
  <section class="content">
    <div class="scroll center" data-od-id="breath-body">
      <div class="empty" data-od-id="breath-guide">
        <p data-od-id="technique-name">אנחה פיזיולוגית</p>
        <div class="breath-circle" data-od-id="breath-circle"><span data-od-id="breath-cue">שאיפה דרך האף</span></div>
        <p data-od-id="round-counter">סבב 1 מתוך 4</p>
      </div>

      <div class="pill-row" data-od-id="breath-exit">
        <button class="pill lg active" data-od-id="done-button" data-target="calm-tools.html">סיימתי</button>
      </div>

      <p class="fine-print" data-od-id="sources">פרקטיקות ויסות מבוססות ראיות</p>
    </div>
  </section>
</main>
<script>
  document.querySelectorAll('[data-target]').forEach(function (el) {
    el.addEventListener('click', function () { location.href = el.dataset.target; });
  });
</script>
</body>
</html>
