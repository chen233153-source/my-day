<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - בניית שגרת בוקר</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="morning-build-screen">
  <section class="content">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label" data-od-id="step-label">3 מתוך 4</span>
      <button class="back-btn" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>

    <header class="heading" data-od-id="step-heading">
      <h1>הבוקר מתחיל בערב</h1>
      <p class="subtitle">חמישה דברים קטנים מהערב. בחרי כמה שבא לך.</p>
    </header>

    <div class="scroll clear-dots" data-od-id="evening-prep">
      <div class="cards" data-od-id="evening-prep-options">
        <button class="choice-card" data-od-id="prep-why">
          <span class="radio check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span class="card-text"><strong>להגיד לעצמי למה כדאי לקום מחר</strong></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M8 14a6 6 0 118 0c-1 1-1 2-1 3H9c0-1 0-2-1-3z"/></svg></span>
        </button>

        <button class="choice-card" data-od-id="prep-phone-away">
          <span class="radio check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span class="card-text"><strong>להרחיק את הטלפון או השעון מהמיטה</strong></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M4 21L20 3"/></svg></span>
        </button>

        <button class="choice-card" data-od-id="prep-water">
          <span class="radio check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span class="card-text"><strong>להכין כוס מים ליד המיטה</strong></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M6 4h12l-1.4 15a2 2 0 01-2 1.8H9.4a2 2 0 01-2-1.8z"/><path d="M6.7 11h10.6"/></svg></span>
        </button>

        <button class="choice-card" data-od-id="prep-clothes">
          <span class="radio check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span class="card-text"><strong>להוציא בגדים מוכנים</strong></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M9 3l3 2 3-2 5 3-2 4-2-1v12H8V9L6 10 4 6z"/></svg></span>
        </button>

        <button class="choice-card" data-od-id="prep-notebook">
          <span class="radio check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span class="card-text"><strong>להניח את המחברת והעט במקום שאראה</strong></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z"/><path d="M8 3v18"/></svg></span>
        </button>
      </div>

      <div class="hero-card" data-od-id="none-selected-note">
        <p>אפשר גם בלי. הראשון הוא זה שהכי משנה.</p>
      </div>
    </div>

    <div class="bottom">
      <div class="dots" aria-hidden="true" data-od-id="step-indicator">
        <span class="dot"></span><span class="dot"></span><span class="dot active"></span><span class="dot"></span>
      </div>
      <button class="cta" data-od-id="next-button">הלאה</button>
    </div>
  </section>
</main>
</body>
</html>
