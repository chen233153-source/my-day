<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - הקמת מטרה</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="compass-goal-editor-screen">
  <section class="content">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">גודל המטרה</span>
      <button class="back-btn" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>

    

    <header class="heading" data-od-id="zones-heading">
      <h1 data-od-id="screen-title">זה מספיק גדול?</h1>
      <p class="subtitle">מטרה שנוחה לך לא תזיז אותך. מטרה דמיונית תשבור אותך.</p>
    </header>

    <div class="scroll" data-od-id="zones-body">
      <section class="cards" data-od-id="three-zones">
        <button class="choice-card" data-od-id="zone-comfort">
          <span class="radio"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span class="card-text"><strong>אזור נוחות</strong><span>אני יודעת שאני יכולה</span></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 12h16"/></svg></span>
        </button>
        <button class="choice-card" data-od-id="zone-discomfort">
          <span class="radio"></span>
          <span class="card-text"><strong>אזור אי-נוחות</strong><span>לא בטוחה שאצליח, אבל זה אפשרי</span></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 18c5-1 8-4 9-9"/><path d="M13 9h5v5"/></svg></span>
        </button>
        <button class="choice-card" data-od-id="zone-delusion">
          <span class="radio"></span>
          <span class="card-text"><strong>אזור אשליה</strong><span>האמת שזה לא ריאלי</span></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 4l8 15H4z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg></span>
        </button>
      </section>

      <div class="field" data-od-id="scale-up-field">
        <label for="bigger-goal">אפשר להגדיל?</label>
        <input id="bigger-goal" value="להביא 12 לקוחות עד סוף המחזור">
      </div>

      <div class="pill-row" data-od-id="scale-up-suggestions">
        <button class="pill">15 לקוחות</button>
        <button class="pill">20 לקוחות</button>
        <button class="pill">להוסיף תאריך</button>
      </div>
    </div>

    <div class="bottom" data-od-id="zones-actions">
      <div class="btn-row">
        <button class="cta" data-od-id="save-bigger">לעדכן ולהמשיך</button>
        <button class="cta secondary" data-od-id="keep-as-is">להשאיר כמו שזה</button>
      </div>
    </div>
  </section>
</main>
<script>
  /* 1.8 · לא היה script ולא data-target. כל הכפתורים היו דקורטיביים,
     והמסך הבטיח "2 מתוך 5" כששאר השלבים לא קיימים בפרויקט. 30.7 */
  document.querySelectorAll('.choice-card').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.choice-card').forEach(function (o) { o.classList.remove('selected'); });
      c.classList.add('selected');
    });
  });
  document.querySelectorAll('[data-od-id="save-bigger"], [data-od-id="keep-as-is"]').forEach(function (b) {
    b.addEventListener('click', function () { location.href = 'compass-home.html'; });
  });
</script>
</body>
</html>
