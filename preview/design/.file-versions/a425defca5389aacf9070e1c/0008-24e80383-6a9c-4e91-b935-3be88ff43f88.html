<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — שעת ערב</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-pill: 999px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 390px; height: 844px;
    background: linear-gradient(175deg, #9b5de5 0%, #9b5de5 30%, #ede9fe 60%, #ede9fe 100%);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px color-mix(in oklch, var(--fg) 18%, transparent);
  }

  /* ── Atmosphere ── */
  .glow { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(80px) }
  .glow-1 { width: 280px; height: 280px; background: color-mix(in oklch, var(--accent) 50%, transparent); top: -60px; left: -60px }
  .glow-2 { width: 200px; height: 200px; background: color-mix(in oklch, var(--accent-secondary) 20%, transparent); bottom: 80px; right: -50px }

  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid color-mix(in oklch, var(--surface) 6%, transparent);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none;
  }
  .ring-1 { width: 460px; height: 460px }
  .ring-2 { width: 320px; height: 320px; border-color: color-mix(in oklch, var(--surface) 4%, transparent) }

  .content {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 80px 32px 56px;
  }

  /* ── Top bar ── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px }
  .back-btn {
    width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid color-mix(in oklch, var(--surface) 15%, transparent);
    background: color-mix(in oklch, var(--surface) 10%, transparent);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .back-btn svg { width: 20px; height: 20px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .step-label { font-size: 14px; font-weight: 500; color: color-mix(in oklch, var(--surface) 55%, transparent) }

  /* ── Heading ── */
  .heading-area { margin-bottom: 28px; text-align: center }
  h1 { font-size: 30px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; color: var(--surface) }
  .subtitle { font-size: 15px; color: color-mix(in oklch, var(--surface) 55%, transparent); line-height: 1.6 }

  /* ── Moon ── */
  .illustration { display: flex; align-items: center; justify-content: center; margin-bottom: 28px }
  .moon {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px color-mix(in oklch, var(--fg) 25%, transparent), 0 0 0 1px color-mix(in oklch, var(--surface) 15%, transparent);
    font-size: 42px; line-height: 1;
    animation: float 3s ease-in-out infinite;
  }
  .moon svg {
    width: 46px; height: 46px;
    display: block;
    color: var(--accent);
  }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

  /* ── Time picker ── */
  .picker-area { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 20px }

  .time-display { display: flex; align-items: center; gap: 8px; direction: ltr }
  .time-col { display: flex; flex-direction: column; align-items: center; gap: 6px }
  .arrow-btn {
    width: 44px; height: 44px;
    border-radius: 12px; border: none;
    background: color-mix(in oklch, var(--surface) 12%, transparent);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s;
  }
  .arrow-btn:active { background: color-mix(in oklch, var(--surface) 20%, transparent) }
  .arrow-btn svg { width: 20px; height: 20px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .time-val {
    width: 80px; height: 72px;
    border-radius: var(--radius);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800;
    color: var(--fg);
    box-shadow: 0 8px 24px color-mix(in oklch, var(--fg) 20%, transparent);
  }
  .time-sep { font-size: 36px; font-weight: 800; color: var(--surface); padding-bottom: 4px }

  /* ── Presets ── */
  .presets { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center }
  .preset {
    padding: 10px 18px;
    border-radius: var(--radius-pill);
    border: 1px solid color-mix(in oklch, var(--surface) 20%, transparent);
    background: color-mix(in oklch, var(--surface) 8%, transparent);
    backdrop-filter: blur(4px);
    font-family: var(--font);
    font-size: 14px; font-weight: 500;
    color: color-mix(in oklch, var(--surface) 70%, transparent);
    cursor: pointer;
    transition: border-color .2s, background .2s, color .2s;
  }
  .preset:hover { border-color: color-mix(in oklch, var(--surface) 40%, transparent) }
  .preset.active {
    background: var(--surface);
    border-color: var(--surface);
    color: var(--fg);
    box-shadow: 0 4px 12px color-mix(in oklch, var(--fg) 15%, transparent);
  }

  .hint { font-size: 13px; color: color-mix(in oklch, var(--surface) 40%, transparent); text-align: center; line-height: 1.5; margin-top: 4px }

  /* ── Bottom ── */
  .bottom { padding-top: 16px; display: flex; flex-direction: column; gap: 16px; align-items: center }

  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in oklch, var(--surface) 20%, transparent) }
  .dot.done { background: color-mix(in oklch, var(--surface) 40%, transparent) }
  .dot.active { width: 24px; border-radius: var(--radius-pill); background: var(--surface) }

  .cta {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 56px;
    border: none; border-radius: var(--radius);
    background: var(--accent-secondary);
    color: var(--fg);
    font-family: var(--font);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 24px color-mix(in oklch, var(--accent-secondary) 30%, transparent);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:active { transform: scale(.97); box-shadow: 0 3px 12px color-mix(in oklch, var(--accent-secondary) 20%, transparent) }
  /* OD cohesive app layer: approved v2 visual language */
  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --mint: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-lg: 24px;
    --radius-pill: 999px;
    --pill: 999px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background:
      radial-gradient(ellipse at 30% 12%, color-mix(in oklch, var(--accent) 20%, transparent), transparent 34%),
      radial-gradient(ellipse at 68% 88%, color-mix(in oklch, var(--accent-secondary) 14%, transparent), transparent 32%),
      var(--bg);
  }

  .phone {
    background:
      radial-gradient(ellipse at 18% 7%, color-mix(in oklch, var(--surface) 26%, transparent), transparent 31%),
      radial-gradient(ellipse at 88% 24%, color-mix(in oklch, var(--accent-secondary) 16%, transparent), transparent 35%),
      radial-gradient(ellipse at 38% 74%, color-mix(in oklch, var(--bg) 24%, transparent), transparent 48%),
      linear-gradient(156deg, color-mix(in oklch, var(--fg) 78%, var(--accent)) 0%, color-mix(in oklch, var(--fg) 36%, var(--accent)) 30%, var(--accent) 58%, color-mix(in oklch, var(--accent) 55%, var(--bg)) 82%, var(--bg) 120%);
    box-shadow: 0 40px 80px color-mix(in oklch, var(--fg) 22%, transparent), 0 8px 24px color-mix(in oklch, var(--fg) 18%, transparent);
  }

  .scroll { padding-inline: 20px; }
  .glow-1 { background: color-mix(in oklch, var(--surface) 28%, transparent) !important; }
  .glow-2 { background: color-mix(in oklch, var(--accent-secondary) 18%, transparent) !important; }
  .glow-3 { background: color-mix(in oklch, var(--accent) 24%, transparent) !important; }
  .ring { border-color: color-mix(in oklch, var(--surface) 8%, transparent) !important; }

  .card,
  .tasks-card,
  .habit-card,
  .time-card,
  .queue-item,
  .glass,
  .reflect-card,
  .quote-card,
  .card-pink {
    border-radius: var(--radius);
    border: 1px solid color-mix(in oklch, var(--surface) 18%, transparent);
    box-shadow: inset 0 1px 0 color-mix(in oklch, var(--surface) 14%, transparent);
  }

  .tasks-card,
  .glass,
  .quote-card,
  .reflect-card,
  .card-pink,
  .queue-item:not(.active) {
    background: color-mix(in oklch, var(--surface) 14%, transparent);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .quote-card,
  .reflect-card,
  .card-pink,
  .glass-purple {
    color: var(--surface);
  }

  .quote-card::before,
  .reflect-card::before {
    background: color-mix(in oklch, var(--mint) 78%, var(--surface));
  }

  .actions,
  .quick-actions {
    gap: 9px;
    margin-bottom: 18px;
  }

  .action-card,
  .action-btn,
  .qa-btn,
  .pill {
    min-height: 44px;
    border-radius: var(--radius);
    transition: transform .15s cubic-bezier(.2,0,0,1), box-shadow .15s cubic-bezier(.2,0,0,1), opacity .15s cubic-bezier(.2,0,0,1);
  }

  .action-card,
  .action-btn,
  .qa-btn {
    box-shadow: 0 14px 24px color-mix(in oklch, var(--fg) 10%, transparent);
  }

  .action-card:active,
  .action-btn:active,
  .qa-btn:active,
  .cta:active,
  .cta-purple:active,
  .btn-pill:active,
  .btn-save:active,
  .btn-sm:active,
  .btn-start:active,
  .btn-skip-task:active,
  .preset:active,
  .fab:active {
    transform: translateY(1px) scale(.985);
    opacity: .9;
  }

  .cta,
  .cta-purple,
  .btn-pill,
  .btn-save,
  .btn-sm,
  .pill-mint,
  .preset.active {
    background: var(--accent-secondary) !important;
    color: var(--fg) !important;
    border-color: color-mix(in oklch, var(--accent-secondary) 72%, var(--surface)) !important;
    box-shadow: 0 16px 28px color-mix(in oklch, var(--fg) 14%, transparent) !important;
  }

  .btn-ghost,
  .btn-skip,
  .btn-skip-task {
    color: color-mix(in oklch, var(--surface) 78%, transparent) !important;
    border-color: color-mix(in oklch, var(--surface) 22%, transparent) !important;
  }

  .tab-bar {
    background: color-mix(in oklch, var(--fg) 26%, transparent) !important;
    border-top: 1px solid color-mix(in oklch, var(--surface) 9%, transparent);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  .tab { color: color-mix(in oklch, var(--surface) 34%, transparent) !important; }
  .tab.active { color: var(--surface) !important; font-weight: 700; }
  .fab {
    background: var(--surface) !important;
    box-shadow: 0 4px 20px color-mix(in oklch, var(--fg) 20%, transparent) !important;
  }
  .fab svg { stroke: var(--accent) !important; fill: none !important; }

  .manifest-card {
    background: linear-gradient(135deg, color-mix(in oklch, var(--mint) 72%, var(--surface)), color-mix(in oklch, var(--mint) 36%, var(--bg)));
    color: var(--fg);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }
  

  .btn-gratitude,
  .qa-gratitude,
  .pill-mint,
  .card-gratitude {
    background: var(--accent-secondary) !important;
    color: var(--fg) !important;
  }

  .btn-growth,
  .pill-pink,
  .qa-stuck,
  .qa-calm,
  .habit-icon.pink,
  .habit-icon.blue,
  .habit-icon.orange,
  .habit-card.selected .habit-icon.pink,
  .habit-card.selected .habit-icon.blue,
  .habit-card.selected .habit-icon.orange,
  .glass-pink {
    background: color-mix(in oklch, var(--surface) 16%, transparent) !important;
    color: var(--surface) !important;
    border-color: color-mix(in oklch, var(--surface) 20%, transparent) !important;
  }

  .card-growth,
  .qa-stuck,
  .qa-calm {
    color: var(--fg) !important;
  }

  .card-growth {
    background: var(--surface) !important;
    box-shadow: 0 14px 24px color-mix(in oklch, var(--fg) 10%, transparent) !important;
  }
  /* End OD cohesive app layer */
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>

  <div class="content">
    <div class="top-bar" data-od-id="top-bar">
      <button class="back-btn" data-od-id="back-button">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="step-label">5 מתוך 5</span>
    </div>

    <div class="heading-area" data-od-id="evening-heading">
      <h1>מתי הערב שלך מתחיל?</h1>
      <p class="subtitle">נשתמש בזה כדי לדעת מתי לעבור<br>למצב ערב ולהזכיר לך להירגע.</p>
    </div>

    <div class="illustration" data-od-id="moon-illustration">
      <div class="moon" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M43.2 51.4c-13.8 0-25-11.2-25-25 0-6.1 2.2-11.8 5.9-16.1C15.3 13.5 9 21.9 9 31.8 9 44.6 19.4 55 32.2 55c9.9 0 18.3-6.2 21.6-15-2.8 7-7 11.4-10.6 11.4z" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <div class="picker-area" data-od-id="time-picker">
      <div class="time-display">
        <div class="time-col">
          <button class="arrow-btn" data-od-id="hour-up" onclick="adj('hour',1)">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <div class="time-val" id="hour">20</div>
          <button class="arrow-btn" data-od-id="hour-down" onclick="adj('hour',-1)">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <span class="time-sep">:</span>
        <div class="time-col">
          <button class="arrow-btn" data-od-id="min-up" onclick="adj('min',1)">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <div class="time-val" id="min">00</div>
          <button class="arrow-btn" data-od-id="min-down" onclick="adj('min',-1)">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>

      <div class="presets" data-od-id="time-presets">
        <button class="preset" onclick="set(18,0,this)">18:00</button>
        <button class="preset" onclick="set(19,0,this)">19:00</button>
        <button class="preset active" onclick="set(20,0,this)">20:00</button>
        <button class="preset" onclick="set(21,0,this)">21:00</button>
        <button class="preset" onclick="set(22,0,this)">22:00</button>
      </div>

      <p class="hint">תמיד אפשר לשנות את זה בהגדרות.</p>
    </div>

    <div class="bottom" data-od-id="evening-cta-area">
      <div class="dots" data-od-id="step-dots">
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot active"></div>
      </div>
      <button class="cta" data-od-id="finish-button">סיימתי!</button>
    </div>
  </div>
</div>

<script>
let h = 20, m = 0;
function render() {
  document.getElementById('hour').textContent = String(h).padStart(2,'0');
  document.getElementById('min').textContent = String(m).padStart(2,'0');
  document.querySelectorAll('.preset').forEach(p => {
    const [ph,pm] = p.textContent.split(':').map(Number);
    p.classList.toggle('active', ph===h && pm===m);
  });
}
function adj(unit, dir) {
  if (unit==='hour') { h = (h+dir+24)%24 }
  else { m = (m+dir*15+60)%60 }
  render();
}
function set(sh,sm,el) { h=sh; m=sm; render() }
</script>

</body>
</html>
