<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — שעת ערב</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-pill: 999px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(30,27,46,.18);
  }

  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .3; pointer-events: none }
  .blob-1 { width: 240px; height: 240px; background: #7c3aed; top: -40px; right: -80px }
  .blob-2 { width: 180px; height: 180px; background: var(--accent-secondary); bottom: 60px; left: -60px; opacity: .2 }

  .content {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 80px 32px 56px;
  }

  /* ── Top bar ── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px }
  .back-btn {
    width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .back-btn svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .step-label { font-size: 14px; font-weight: 500; color: var(--muted) }

  /* ── Heading ── */
  .heading-area { margin-bottom: 40px }
  h1 { font-size: 28px; font-weight: 800; line-height: 1.3; margin-bottom: 10px }
  .subtitle { font-size: 15px; color: var(--muted); line-height: 1.6 }

  /* ── Moon illustration ── */
  .illustration {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 40px;
  }
  .moon {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c084fc 0%, var(--accent) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(155,93,229,.3);
    font-size: 48px;
    line-height: 1;
  }

  /* ── Time picker ── */
  .picker-area { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 24px }

  .time-display {
    display: flex; align-items: center; gap: 8px;
    direction: ltr;
  }
  .time-col {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .arrow-btn {
    width: 44px; height: 44px;
    border-radius: 12px; border: none;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(30,27,46,.06);
    transition: background .15s;
  }
  .arrow-btn:active { background: var(--border) }
  .arrow-btn svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .time-val {
    width: 80px; height: 72px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800;
    color: var(--fg);
    box-shadow: 0 0 0 3px rgba(155,93,229,.12);
  }
  .time-sep { font-size: 36px; font-weight: 800; color: var(--accent); padding-bottom: 4px }

  /* ── Presets ── */
  .presets {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .preset {
    padding: 10px 18px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--font);
    font-size: 14px; font-weight: 500;
    color: var(--fg);
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .preset:hover { border-color: var(--accent) }
  .preset.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--surface);
  }

  .hint { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; margin-top: 8px }

  /* ── Bottom ── */
  .bottom { padding-top: 16px; display: flex; flex-direction: column; gap: 16px; align-items: center }

  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border) }
  .dot.done { background: var(--accent); opacity: .5 }
  .dot.active { width: 24px; border-radius: var(--radius-pill); background: var(--accent) }

  .cta {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 56px;
    border: none; border-radius: var(--radius);
    background: var(--accent-secondary);
    color: var(--fg);
    font-family: var(--font);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(52,211,153,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:active { transform: scale(.97); box-shadow: 0 3px 12px rgba(52,211,153,.2) }
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="content">
    <div class="top-bar" data-od-id="top-bar">
      <button class="back-btn" data-od-id="back-button">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="step-label">4 מתוך 4</span>
    </div>

    <div class="heading-area" data-od-id="evening-heading">
      <h1>מתי הערב שלך מתחיל?</h1>
      <p class="subtitle">נשתמש בזה כדי לדעת מתי לעבור<br>למצב ערב ולהזכיר לך להירגע.</p>
    </div>

    <div class="illustration" data-od-id="moon-illustration">
      <div class="moon">🌙</div>
    </div>

    <div class="picker-area" data-od-id="time-picker">
      <div class="time-display">
        <div class="time-col">
          <button class="arrow-btn" data-od-id="min-up" onclick="adj('min',1)">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <div class="time-val" id="min">00</div>
          <button class="arrow-btn" data-od-id="min-down" onclick="adj('min',-1)">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <span class="time-sep">:</span>
        <div class="time-col">
          <button class="arrow-btn" data-od-id="hour-up" onclick="adj('hour',1)">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <div class="time-val" id="hour">20</div>
          <button class="arrow-btn" data-od-id="hour-down" onclick="adj('hour',-1)">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>

      <div class="presets" data-od-id="time-presets">
        <button class="preset" onclick="set(18,0,this)">18:00</button>
        <button class="preset" onclick="set(19,0,this)">19:00</button>
        <button class="preset active" onclick="set(20,0,this)">20:00</button>
        <button class="preset" onclick="set(21,0,this)">21:00</button>
        <button class="preset" onclick="set(22,0,this)">22:00</button>
      </div>

      <p class="hint">תמיד אפשר לשנות את זה בהגדרות.</p>
    </div>

    <div class="bottom" data-od-id="evening-cta-area">
      <div class="dots" data-od-id="step-dots">
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot active"></div>
      </div>
      <button class="cta" data-od-id="finish-button">סיימתי!</button>
    </div>
  </div>
</div>

<script>
let h = 20, m = 0;
function render() {
  document.getElementById('hour').textContent = String(h).padStart(2,'0');
  document.getElementById('min').textContent = String(m).padStart(2,'0');
  document.querySelectorAll('.preset').forEach(p => {
    const [ph,pm] = p.textContent.split(':').map(Number);
    p.classList.toggle('active', ph===h && pm===m);
  });
}
function adj(unit, dir) {
  if (unit==='hour') { h = (h+dir+24)%24 }
  else { m = (m+dir*15+60)%60 }
  render();
}
function set(sh,sm,el) { h=sh; m=sm; render() }
</script>

</body>
</html>
