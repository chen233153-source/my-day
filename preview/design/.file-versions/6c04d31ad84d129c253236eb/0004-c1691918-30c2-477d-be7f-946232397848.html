<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — מה השם שלך?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-pill: 999px;
    --font: 'Assistant', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 390px; height: 844px;
    background: linear-gradient(175deg, #7c3aed 0%, #9b5de5 30%, #c084fc 60%, #e9a8c9 100%);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(30,27,46,.18);
  }

  .glow { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(80px) }
  .glow-1 { width: 260px; height: 260px; background: rgba(192,132,252,.5); top: -50px; right: -60px }
  .glow-2 { width: 200px; height: 200px; background: rgba(52,211,153,.18); bottom: 120px; left: -60px }

  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.06);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none;
  }
  .ring-1 { width: 460px; height: 460px }
  .ring-2 { width: 320px; height: 320px; border-color: rgba(255,255,255,.04) }

  .content {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 80px 32px 56px;
  }

  /* ── Top bar ── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px }
  .back-btn {
    width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .back-btn svg { width: 20px; height: 20px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .step-label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.55) }

  /* ── Heading ── */
  .heading-area { margin-bottom: 40px }
  h1 { font-size: 30px; font-weight: 800; line-height: 1.3; margin-bottom: 12px; color: var(--surface) }
  .subtitle { font-size: 15px; color: rgba(255,255,255,.55); line-height: 1.6 }

  /* ── Input ── */
  .input-group { margin-bottom: auto }
  .input-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.5); margin-bottom: 10px; display: block }
  .name-input {
    width: 100%; height: 56px;
    border-radius: var(--radius);
    border: 2px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
    padding: 0 20px;
    font-family: var(--font);
    font-size: 18px; font-weight: 500;
    color: var(--surface);
    outline: none;
    transition: border-color .2s, background .2s;
  }
  .name-input::placeholder { color: rgba(255,255,255,.35) }
  .name-input:focus { border-color: var(--surface); background: rgba(255,255,255,.18) }

  /* ── Bottom ── */
  .bottom { display: flex; flex-direction: column; gap: 16px; align-items: center }

  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2) }
  .dot.done { background: rgba(255,255,255,.4) }
  .dot.active { width: 24px; border-radius: var(--radius-pill); background: var(--surface) }

  .cta {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 56px;
    border: none; border-radius: var(--radius);
    background: var(--accent-secondary);
    color: var(--fg);
    font-family: var(--font);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(52,211,153,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:active { transform: scale(.97); box-shadow: 0 3px 12px rgba(52,211,153,.2) }
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>

  <div class="content">
    <div class="top-bar" data-od-id="top-bar">
      <button class="back-btn" data-od-id="back-button">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="step-label">2 מתוך 4</span>
    </div>

    <div class="heading-area" data-od-id="identity-heading">
      <h1>מה השם שלך?</h1>
      <p class="subtitle">ככה נדע איך לפנות אלייך.<br>תמיד אפשר לשנות אחר כך.</p>
    </div>

    <div class="input-group" data-od-id="name-input-group">
      <label class="input-label">השם שלך</label>
      <input class="name-input" type="text" placeholder="למשל: נועה" autofocus data-od-id="name-input">
    </div>

    <div class="bottom" data-od-id="identity-cta-area">
      <div class="dots" data-od-id="step-dots">
        <div class="dot done"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <button class="cta" data-od-id="continue-button">המשיכי</button>
    </div>
  </div>
</div>

</body>
</html>
