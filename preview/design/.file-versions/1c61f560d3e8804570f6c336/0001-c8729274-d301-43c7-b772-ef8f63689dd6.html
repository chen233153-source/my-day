<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - רגע ההתנגדות</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="habit-resistance-screen">
  <section class="content with-tabs">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">ערב</span>
      <button class="back-btn" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>

    <header class="heading" data-od-id="resistance-heading">
      <h1 data-od-id="screen-title">היום זה לא קרה</h1>
      <p class="subtitle">זה בסדר. שאלה אחת ואנחנו ממשיכות.</p>
    </header>

    <section class="cards" data-od-id="reason-options">
      <button class="choice-card" data-reply="לשנות שעה?">
        <span class="radio"></span>
        <span class="card-text"><strong>לא היה זמן</strong><span>ננסה למצוא חלון אחר</span></span>
        <span class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      </button>
      <button class="choice-card selected" data-reply="העוגן אולי לא מספיק חזק. לנסות עוגן אחר?">
        <span class="radio"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
        <span class="card-text"><strong>שכחתי</strong><span>נבדוק את העוגן</span></span>
        <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M3 12h4M17 12h4"/></svg></span>
      </button>
      <button class="choice-card" data-reply="אולי הפעולה עדיין גדולה. להקטין?">
        <span class="radio"></span>
        <span class="card-text"><strong>לא היה לי כוח</strong><span>נקטין עוד שלב</span></span>
        <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 12h16M12 4v16"/></svg></span>
      </button>
      <button class="choice-card" data-reply="זה קורה. מחר יש הזדמנות נוספת">
        <span class="radio"></span>
        <span class="card-text"><strong>לא היה בא לי</strong><span>מחר ממשיכים בעדינות</span></span>
        <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-8-8"/><path d="M20 4v8h-8"/></svg></span>
      </button>
    </section>

    <div class="hero-card" data-od-id="method-response" style="margin-top:16px">
      <p>העוגן אולי לא מספיק חזק. לנסות עוגן אחר?</p>
    </div>

    <section class="sheet" data-od-id="two-day-state">
      <h1>פעמיים ברצף</h1>
      <p>פעם אחת זו תאונה. פעמיים זו התחלה של משהו אחר. מחר הכי חשוב.</p>
      <button class="cta">להקטין פעולה</button>
      <button class="cta secondary">להחליף עוגן</button>
    </section>
  </section>

  <nav class="tab-bar" data-od-id="tab-bar">
    <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-4 6-2-3"/></svg><span>המצפן</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.4-7 10-7 10z"/></svg><span>תודות</span></button>
    <button class="fab" aria-label="שיחה"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 01-4 4H8l-5 3V7a4 4 0 014-4h10a4 4 0 014 4z"/></svg></button>
    <button class="tab active"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8 14a6 6 0 118 0c-1 1-1 2-1 3H9c0-1 0-2-1-3z"/></svg><span>הרגלים</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>עכשיו</span></button>
  </nav>
</main>
<script>
  const response = document.querySelector('[data-od-id="method-response"] p');
  document.querySelectorAll('.choice-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.choice-card').forEach(item => item.classList.remove('selected'));
      card.classList.add('selected');
      response.textContent = card.dataset.reply;
      localStorage.setItem('habitResistanceReason', card.querySelector('strong').textContent);
    });
  });
</script>
</body>
</html>
