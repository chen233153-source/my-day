<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — בחירת הרגל</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-pill: 999px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 390px; height: 844px;
    background: linear-gradient(175deg, #9b5de5 0%, #9b5de5 30%, #ede9fe 60%, #ede9fe 100%);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px color-mix(in oklch, var(--fg) 18%, transparent);
  }

  .glow { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(80px) }
  .glow-1 { width: 240px; height: 240px; background: color-mix(in oklch, var(--bg) 50%, transparent); top: -40px; left: -60px }
  .glow-2 { width: 180px; height: 180px; background: color-mix(in oklch, var(--accent-secondary) 18%, transparent); bottom: 80px; right: -50px }

  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid color-mix(in oklch, var(--surface) 6%, transparent);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none;
  }
  .ring-1 { width: 460px; height: 460px }
  .ring-2 { width: 320px; height: 320px; border-color: color-mix(in oklch, var(--surface) 4%, transparent) }

  .content {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 80px 32px 56px;
  }

  /* ── Top bar ── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px }
  .back-btn {
    width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid color-mix(in oklch, var(--surface) 15%, transparent);
    background: color-mix(in oklch, var(--surface) 10%, transparent);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .back-btn svg { width: 20px; height: 20px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .step-label { font-size: 14px; font-weight: 500; color: color-mix(in oklch, var(--surface) 55%, transparent) }

  /* ── Heading ── */
  .heading-area { margin-bottom: 20px }
  h1 { font-size: 28px; font-weight: 800; line-height: 1.3; margin-bottom: 8px; color: var(--surface) }
  .subtitle { font-size: 15px; color: color-mix(in oklch, var(--surface) 55%, transparent); line-height: 1.6 }

  /* ── Habit list ── */
  .habits { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px }
  .habits::-webkit-scrollbar { display: none }

  .habit-card {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    background: color-mix(in oklch, var(--surface) 12%, transparent);
    backdrop-filter: blur(8px);
    border-radius: var(--radius);
    border: 1px solid color-mix(in oklch, var(--surface) 15%, transparent);
    cursor: pointer;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .habit-card:hover { border-color: color-mix(in oklch, var(--surface) 30%, transparent) }
  .habit-card.selected {
    background: var(--surface);
    border-color: var(--surface);
    box-shadow: 0 6px 20px color-mix(in oklch, var(--fg) 15%, transparent);
  }
  .habit-card.selected .habit-name { color: var(--fg) }
  .habit-card.selected .habit-desc { color: var(--muted) }

  .habit-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .habit-icon.purple { background: color-mix(in oklch, var(--accent) 15%, transparent) }
  .habit-icon.green { background: color-mix(in oklch, var(--accent-secondary) 15%, transparent) }
  .habit-icon.pink { background: color-mix(in oklch, var(--accent) 12%, transparent) }
  .habit-icon.blue { background: color-mix(in oklch, var(--bg) 15%, transparent) }
  .habit-icon.orange { background: color-mix(in oklch, var(--accent-secondary) 12%, transparent) }
  .habit-card.selected .habit-icon.purple { background: color-mix(in oklch, var(--accent) 12%, transparent) }
  .habit-card.selected .habit-icon.green { background: color-mix(in oklch, var(--accent-secondary) 12%, transparent) }
  .habit-card.selected .habit-icon.pink { background: color-mix(in oklch, var(--accent) 10%, transparent) }
  .habit-card.selected .habit-icon.blue { background: color-mix(in oklch, var(--bg) 12%, transparent) }
  .habit-card.selected .habit-icon.orange { background: color-mix(in oklch, var(--accent-secondary) 10%, transparent) }

  .habit-text { flex: 1 }
  .habit-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; color: var(--surface) }
  .habit-desc { font-size: 13px; color: color-mix(in oklch, var(--surface) 50%, transparent) }

  .habit-check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid color-mix(in oklch, var(--surface) 25%, transparent);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
  }
  .habit-card.selected .habit-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .habit-check svg { width: 14px; height: 14px; stroke: var(--surface); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0 }
  .habit-card.selected .habit-check svg { opacity: 1 }

  /* ── Bottom ── */
  .bottom { padding-top: 12px; display: flex; flex-direction: column; gap: 16px; align-items: center }

  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in oklch, var(--surface) 20%, transparent) }
  .dot.done { background: color-mix(in oklch, var(--surface) 40%, transparent) }
  .dot.active { width: 24px; border-radius: var(--radius-pill); background: var(--surface) }

  .cta {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 56px;
    border: none; border-radius: var(--radius);
    background: var(--accent-secondary);
    color: var(--fg);
    font-family: var(--font);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 24px color-mix(in oklch, var(--accent-secondary) 30%, transparent);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:active { transform: scale(.97); box-shadow: 0 3px 12px color-mix(in oklch, var(--accent-secondary) 20%, transparent) }
  /* OD cohesive app layer: approved v2 visual language */
  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --mint: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-lg: 24px;
    --radius-pill: 999px;
    --pill: 999px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background:
      radial-gradient(ellipse at 30% 12%, color-mix(in oklch, var(--accent) 20%, transparent), transparent 34%),
      radial-gradient(ellipse at 68% 88%, color-mix(in oklch, var(--accent-secondary) 14%, transparent), transparent 32%),
      var(--bg);
  }

  .phone {
    background:
      radial-gradient(ellipse at 18% 7%, color-mix(in oklch, var(--surface) 26%, transparent), transparent 31%),
      radial-gradient(ellipse at 88% 24%, color-mix(in oklch, var(--accent-secondary) 16%, transparent), transparent 35%),
      radial-gradient(ellipse at 38% 74%, color-mix(in oklch, var(--bg) 24%, transparent), transparent 48%),
      linear-gradient(156deg, color-mix(in oklch, var(--fg) 78%, var(--accent)) 0%, color-mix(in oklch, var(--fg) 36%, var(--accent)) 30%, var(--accent) 58%, color-mix(in oklch, var(--accent) 55%, var(--bg)) 82%, var(--bg) 120%);
    box-shadow: 0 40px 80px color-mix(in oklch, var(--fg) 22%, transparent), 0 8px 24px color-mix(in oklch, var(--fg) 18%, transparent);
  }

  .scroll { padding-inline: 20px; }
  .glow-1 { background: color-mix(in oklch, var(--surface) 28%, transparent) !important; }
  .glow-2 { background: color-mix(in oklch, var(--accent-secondary) 18%, transparent) !important; }
  .glow-3 { background: color-mix(in oklch, var(--accent) 24%, transparent) !important; }
  .ring { border-color: color-mix(in oklch, var(--surface) 8%, transparent) !important; }

  .card,
  .tasks-card,
  .habit-card,
  .time-card,
  .queue-item,
  .glass,
  .reflect-card,
  .quote-card,
  .card-pink {
    border-radius: var(--radius);
    border: 1px solid color-mix(in oklch, var(--surface) 18%, transparent);
    box-shadow: inset 0 1px 0 color-mix(in oklch, var(--surface) 14%, transparent);
  }

  .tasks-card,
  .glass,
  .quote-card,
  .reflect-card,
  .card-pink,
  .queue-item:not(.active) {
    background: color-mix(in oklch, var(--surface) 14%, transparent);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .quote-card,
  .reflect-card,
  .card-pink,
  .glass-purple {
    color: var(--surface);
  }

  .quote-card::before,
  .reflect-card::before {
    background: color-mix(in oklch, var(--mint) 78%, var(--surface));
  }

  .actions,
  .quick-actions {
    gap: 9px;
    margin-bottom: 18px;
  }

  .action-card,
  .action-btn,
  .qa-btn,
  .pill {
    min-height: 44px;
    border-radius: var(--radius);
    transition: transform .15s cubic-bezier(.2,0,0,1), box-shadow .15s cubic-bezier(.2,0,0,1), opacity .15s cubic-bezier(.2,0,0,1);
  }

  .action-card,
  .action-btn,
  .qa-btn {
    box-shadow: 0 14px 24px color-mix(in oklch, var(--fg) 10%, transparent);
  }

  .action-card:active,
  .action-btn:active,
  .qa-btn:active,
  .cta:active,
  .cta-purple:active,
  .btn-pill:active,
  .btn-save:active,
  .btn-sm:active,
  .btn-start:active,
  .btn-skip-task:active,
  .preset:active,
  .fab:active {
    transform: translateY(1px) scale(.985);
    opacity: .9;
  }

  .cta,
  .cta-purple,
  .btn-pill,
  .btn-save,
  .btn-sm,
  .pill-mint,
  .preset.active {
    background: var(--accent-secondary) !important;
    color: var(--fg) !important;
    border-color: color-mix(in oklch, var(--accent-secondary) 72%, var(--surface)) !important;
    box-shadow: 0 16px 28px color-mix(in oklch, var(--fg) 14%, transparent) !important;
  }

  .btn-ghost,
  .btn-skip,
  .btn-skip-task {
    color: color-mix(in oklch, var(--surface) 78%, transparent) !important;
    border-color: color-mix(in oklch, var(--surface) 22%, transparent) !important;
  }

  .tab-bar {
    background: color-mix(in oklch, var(--fg) 26%, transparent) !important;
    border-top: 1px solid color-mix(in oklch, var(--surface) 9%, transparent);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  .tab { color: color-mix(in oklch, var(--surface) 34%, transparent) !important; }
  .tab.active { color: var(--surface) !important; font-weight: 700; }
  .fab {
    background: var(--surface) !important;
    box-shadow: 0 4px 20px color-mix(in oklch, var(--fg) 20%, transparent) !important;
  }
  .fab svg { stroke: var(--accent) !important; fill: none !important; }

  .manifest-card {
    background: linear-gradient(135deg, color-mix(in oklch, var(--mint) 72%, var(--surface)), color-mix(in oklch, var(--mint) 36%, var(--bg)));
    color: var(--fg);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }
  

  .btn-gratitude,
  .qa-gratitude,
  .pill-mint,
  .card-gratitude {
    background: var(--accent-secondary) !important;
    color: var(--fg) !important;
  }

  .btn-growth,
  .pill-pink,
  .qa-stuck,
  .qa-calm,
  .habit-icon.pink,
  .habit-icon.blue,
  .habit-icon.orange,
  .habit-card.selected .habit-icon.pink,
  .habit-card.selected .habit-icon.blue,
  .habit-card.selected .habit-icon.orange,
  .glass-pink {
    background: color-mix(in oklch, var(--surface) 16%, transparent) !important;
    color: var(--surface) !important;
    border-color: color-mix(in oklch, var(--surface) 20%, transparent) !important;
  }

  .card-growth,
  .qa-stuck,
  .qa-calm {
    color: var(--fg) !important;
  }

  .card-growth {
    background: var(--surface) !important;
    box-shadow: 0 14px 24px color-mix(in oklch, var(--fg) 10%, transparent) !important;
  }
  /* End OD cohesive app layer */
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>

  <div class="content">
    <div class="top-bar" data-od-id="top-bar">
      <button class="back-btn" data-od-id="back-button">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="step-label">3 מתוך 4</span>
    </div>

    <div class="heading-area" data-od-id="habit-heading">
      <h1>בחרי הרגל ראשון</h1>
      <p class="subtitle">מה תרצי להתחיל לעקוב אחריו?<br>אפשר להוסיף עוד אחר כך.</p>
    </div>

    <div class="habits" data-od-id="habit-list">
      <div class="habit-card selected" data-od-id="habit-gratitude" onclick="select(this)">
        <div class="habit-icon orange">✍️</div>
        <div class="habit-text">
          <div class="habit-name">כתיבת תודות</div>
          <div class="habit-desc">3 דברים טובים כל בוקר</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-reading" onclick="select(this)">
        <div class="habit-icon purple">📖</div>
        <div class="habit-text">
          <div class="habit-name">קריאת ספר</div>
          <div class="habit-desc">15 דקות לפני השינה</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-journal" onclick="select(this)">
        <div class="habit-icon blue">📝</div>
        <div class="habit-text">
          <div class="habit-name">יומן ערב</div>
          <div class="habit-desc">לכתוב מה עבר עלייך היום</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-walk" onclick="select(this)">
        <div class="habit-icon green">🌿</div>
        <div class="habit-text">
          <div class="habit-name">הליכה בחוץ</div>
          <div class="habit-desc">20 דקות בלי טלפון</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-noscreen" onclick="select(this)">
        <div class="habit-icon pink">📵</div>
        <div class="habit-text">
          <div class="habit-name">שעה בלי מסך</div>
          <div class="habit-desc">לפני השינה — ספר, שיחה, שקט</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>
    </div>

    <div class="bottom" data-od-id="habit-cta-area">
      <div class="dots" data-od-id="step-dots">
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
      <button class="cta" data-od-id="continue-button">המשיכי</button>
    </div>
  </div>
</div>

<script>
function select(card) {
  card.closest('.habits').querySelectorAll('.habit-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
}
</script>

</body>
</html>
