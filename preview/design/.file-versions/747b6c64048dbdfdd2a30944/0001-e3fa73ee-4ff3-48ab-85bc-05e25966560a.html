<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — בחירת הרגל</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-pill: 999px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(30,27,46,.18);
  }

  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .3; pointer-events: none }
  .blob-1 { width: 200px; height: 200px; background: var(--accent); top: 60px; left: -60px }
  .blob-2 { width: 160px; height: 160px; background: #c084fc; bottom: 100px; right: -40px }

  .content {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 80px 32px 56px;
  }

  /* ── Top bar ── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px }
  .back-btn {
    width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .back-btn svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .step-label { font-size: 14px; font-weight: 500; color: var(--muted) }

  /* ── Heading ── */
  .heading-area { margin-bottom: 24px }
  h1 { font-size: 28px; font-weight: 800; line-height: 1.3; margin-bottom: 10px }
  .subtitle { font-size: 15px; color: var(--muted); line-height: 1.6 }

  /* ── Habit list ── */
  .habits { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px }
  .habits::-webkit-scrollbar { display: none }

  .habit-card {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 2px solid var(--border);
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
  }
  .habit-card:hover { border-color: var(--accent) }
  .habit-card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(155,93,229,.15);
  }

  .habit-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .habit-icon.purple { background: rgba(155,93,229,.12) }
  .habit-icon.green { background: rgba(52,211,153,.12) }
  .habit-icon.pink { background: rgba(236,72,153,.1) }
  .habit-icon.blue { background: rgba(96,165,250,.12) }
  .habit-icon.orange { background: rgba(251,146,60,.1) }

  .habit-text { flex: 1 }
  .habit-name { font-size: 16px; font-weight: 600; margin-bottom: 2px }
  .habit-desc { font-size: 13px; color: var(--muted) }

  .habit-check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
  }
  .habit-card.selected .habit-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .habit-check svg { width: 14px; height: 14px; stroke: var(--surface); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0 }
  .habit-card.selected .habit-check svg { opacity: 1 }

  /* ── Bottom ── */
  .bottom { padding-top: 16px; display: flex; flex-direction: column; gap: 16px; align-items: center }

  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border) }
  .dot.done { background: var(--accent); opacity: .5 }
  .dot.active { width: 24px; border-radius: var(--radius-pill); background: var(--accent) }

  .cta {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 56px;
    border: none; border-radius: var(--radius);
    background: var(--accent-secondary);
    color: var(--fg);
    font-family: var(--font);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(52,211,153,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:active { transform: scale(.97); box-shadow: 0 3px 12px rgba(52,211,153,.2) }
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="content">
    <div class="top-bar" data-od-id="top-bar">
      <button class="back-btn" data-od-id="back-button">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="step-label">3 מתוך 4</span>
    </div>

    <div class="heading-area" data-od-id="habit-heading">
      <h1>בחרי הרגל ראשון</h1>
      <p class="subtitle">מה תרצי להתחיל לעקוב אחריו?<br>אפשר להוסיף עוד אחר כך.</p>
    </div>

    <div class="habits" data-od-id="habit-list">
      <div class="habit-card selected" data-od-id="habit-water" onclick="select(this)">
        <div class="habit-icon blue">💧</div>
        <div class="habit-text">
          <div class="habit-name">לשתות מים</div>
          <div class="habit-desc">8 כוסות ביום</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-walk" onclick="select(this)">
        <div class="habit-icon green">🚶‍♀️</div>
        <div class="habit-text">
          <div class="habit-name">הליכה</div>
          <div class="habit-desc">20 דקות בחוץ</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-sleep" onclick="select(this)">
        <div class="habit-icon purple">🌙</div>
        <div class="habit-text">
          <div class="habit-name">שינה בזמן</div>
          <div class="habit-desc">לכבות מסכים עד 23:00</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-tidy" onclick="select(this)">
        <div class="habit-icon orange">🧹</div>
        <div class="habit-text">
          <div class="habit-name">סדר קצר</div>
          <div class="habit-desc">5 דקות סידור בבית</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-breath" onclick="select(this)">
        <div class="habit-icon pink">🧘‍♀️</div>
        <div class="habit-text">
          <div class="habit-name">נשימות</div>
          <div class="habit-desc">3 דקות של שקט</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>
    </div>

    <div class="bottom" data-od-id="habit-cta-area">
      <div class="dots" data-od-id="step-dots">
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
      <button class="cta" data-od-id="continue-button">המשיכי</button>
    </div>
  </div>
</div>

<script>
function select(card) {
  card.closest('.habits').querySelectorAll('.habit-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
}
</script>

</body>
</html>
