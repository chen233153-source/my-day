<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — בחירת הרגל</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-pill: 999px;
    --font: 'Assistant', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 390px; height: 844px;
    background: linear-gradient(175deg, #7c3aed 0%, #9b5de5 30%, #c084fc 60%, #e9a8c9 100%);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(30,27,46,.18);
  }

  .glow { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(80px) }
  .glow-1 { width: 240px; height: 240px; background: rgba(192,132,252,.5); top: -40px; left: -60px }
  .glow-2 { width: 180px; height: 180px; background: rgba(52,211,153,.18); bottom: 80px; right: -50px }

  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.06);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none;
  }
  .ring-1 { width: 460px; height: 460px }
  .ring-2 { width: 320px; height: 320px; border-color: rgba(255,255,255,.04) }

  .content {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 80px 32px 56px;
  }

  /* ── Top bar ── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px }
  .back-btn {
    width: 44px; height: 44px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .back-btn svg { width: 20px; height: 20px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .step-label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.55) }

  /* ── Heading ── */
  .heading-area { margin-bottom: 20px }
  h1 { font-size: 28px; font-weight: 800; line-height: 1.3; margin-bottom: 8px; color: var(--surface) }
  .subtitle { font-size: 15px; color: rgba(255,255,255,.55); line-height: 1.6 }

  /* ── Habit list ── */
  .habits { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px }
  .habits::-webkit-scrollbar { display: none }

  .habit-card {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(8px);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,.15);
    cursor: pointer;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .habit-card:hover { border-color: rgba(255,255,255,.3) }
  .habit-card.selected {
    background: var(--surface);
    border-color: var(--surface);
    box-shadow: 0 6px 20px rgba(30,27,46,.15);
  }
  .habit-card.selected .habit-name { color: var(--fg) }
  .habit-card.selected .habit-desc { color: var(--muted) }

  .habit-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .habit-icon.purple { background: rgba(155,93,229,.15) }
  .habit-icon.green { background: rgba(52,211,153,.15) }
  .habit-icon.pink { background: rgba(236,72,153,.12) }
  .habit-icon.blue { background: rgba(96,165,250,.15) }
  .habit-icon.orange { background: rgba(251,146,60,.12) }
  .habit-card.selected .habit-icon.purple { background: rgba(155,93,229,.12) }
  .habit-card.selected .habit-icon.green { background: rgba(52,211,153,.12) }
  .habit-card.selected .habit-icon.pink { background: rgba(236,72,153,.1) }
  .habit-card.selected .habit-icon.blue { background: rgba(96,165,250,.12) }
  .habit-card.selected .habit-icon.orange { background: rgba(251,146,60,.1) }

  .habit-text { flex: 1 }
  .habit-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; color: var(--surface) }
  .habit-desc { font-size: 13px; color: rgba(255,255,255,.5) }

  .habit-check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.25);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s;
  }
  .habit-card.selected .habit-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .habit-check svg { width: 14px; height: 14px; stroke: var(--surface); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0 }
  .habit-card.selected .habit-check svg { opacity: 1 }

  /* ── Bottom ── */
  .bottom { padding-top: 12px; display: flex; flex-direction: column; gap: 16px; align-items: center }

  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2) }
  .dot.done { background: rgba(255,255,255,.4) }
  .dot.active { width: 24px; border-radius: var(--radius-pill); background: var(--surface) }

  .cta {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 56px;
    border: none; border-radius: var(--radius);
    background: var(--accent-secondary);
    color: var(--fg);
    font-family: var(--font);
    font-size: 18px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(52,211,153,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:active { transform: scale(.97); box-shadow: 0 3px 12px rgba(52,211,153,.2) }
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>

  <div class="content">
    <div class="top-bar" data-od-id="top-bar">
      <button class="back-btn" data-od-id="back-button">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="step-label">3 מתוך 4</span>
    </div>

    <div class="heading-area" data-od-id="habit-heading">
      <h1>בחרי הרגל ראשון</h1>
      <p class="subtitle">מה תרצי להתחיל לעקוב אחריו?<br>אפשר להוסיף עוד אחר כך.</p>
    </div>

    <div class="habits" data-od-id="habit-list">
      <div class="habit-card selected" data-od-id="habit-gratitude" onclick="select(this)">
        <div class="habit-icon orange">✍️</div>
        <div class="habit-text">
          <div class="habit-name">כתיבת תודות</div>
          <div class="habit-desc">3 דברים טובים כל בוקר</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-reading" onclick="select(this)">
        <div class="habit-icon purple">📖</div>
        <div class="habit-text">
          <div class="habit-name">קריאת ספר</div>
          <div class="habit-desc">15 דקות לפני השינה</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-journal" onclick="select(this)">
        <div class="habit-icon blue">📝</div>
        <div class="habit-text">
          <div class="habit-name">יומן ערב</div>
          <div class="habit-desc">לכתוב מה עבר עלייך היום</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-walk" onclick="select(this)">
        <div class="habit-icon green">🌿</div>
        <div class="habit-text">
          <div class="habit-name">הליכה בחוץ</div>
          <div class="habit-desc">20 דקות בלי טלפון</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="habit-card" data-od-id="habit-noscreen" onclick="select(this)">
        <div class="habit-icon pink">📵</div>
        <div class="habit-text">
          <div class="habit-name">שעה בלי מסך</div>
          <div class="habit-desc">לפני השינה — ספר, שיחה, שקט</div>
        </div>
        <div class="habit-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>
    </div>

    <div class="bottom" data-od-id="habit-cta-area">
      <div class="dots" data-od-id="step-dots">
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
      </div>
      <button class="cta" data-od-id="continue-button">המשיכי</button>
    </div>
  </div>
</div>

<script>
function select(card) {
  card.closest('.habits').querySelectorAll('.habit-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
}
</script>

</body>
</html>
