<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — רגע הפעולה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0 }
  :root {
    --fg: #1e1b2e; --accent: #9b5de5; --accent-secondary: #34d399;
    --surface: #ffffff; --muted: #8b85a1; --border: #d4cfe8;
    --radius: 16px; --radius-lg: 24px; --radius-pill: 999px;
    --font: 'Assistant', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  html, body { height: 100%; overflow: hidden }
  body { font-family: var(--font); color: var(--fg); display: flex; align-items: center; justify-content: center; background: #ede9fe }

  .phone {
    width: 390px; height: 844px;
    background: linear-gradient(175deg, #7c3aed 0%, #9b5de5 30%, #c084fc 60%, #e9a8c9 100%);
    border-radius: 44px; position: relative; overflow: hidden;
    box-shadow: 0 24px 80px rgba(30,27,46,.18);
    display: flex; flex-direction: column;
  }

  /* ── Main content ── */
  .main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 56px 28px 24px; gap: 8px;
  }

  /* ── Task label ── */
  .task-label { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 4px }
  .task-name {
    font-size: 22px; font-weight: 800; color: var(--surface);
    text-align: center; line-height: 1.3; margin-bottom: 24px;
  }

  /* ── Timer ring ── */
  .timer-wrap { position: relative; width: 220px; height: 220px; margin-bottom: 28px }
  .timer-ring {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 6 }
  .ring-progress { fill: none; stroke: var(--surface); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 628; stroke-dashoffset: 0; transition: stroke-dashoffset .5s linear;
  }
  .timer-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .timer-mins { font-size: 56px; font-weight: 800; color: var(--surface); line-height: 1; direction: ltr }
  .timer-secs { font-size: 16px; color: rgba(255,255,255,.5); margin-top: 2px }

  /* ── Controls ── */
  .controls { display: flex; gap: 16px; align-items: center; margin-bottom: 20px }
  .btn-start {
    width: 64px; height: 64px; border-radius: 50%; border: none;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 6px 24px rgba(30,27,46,.15);
  }
  .btn-start svg { width: 28px; height: 28px; fill: var(--accent); margin-right: -2px }
  .btn-start.running svg { fill: var(--accent) }
  .btn-skip-task {
    padding: 12px 28px; border-radius: var(--radius-pill);
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1);
    backdrop-filter: blur(4px);
    font-family: var(--font); font-size: 14px; font-weight: 600;
    color: var(--surface); cursor: pointer;
  }

  /* ── Task queue ── */
  .queue { width: 100%; padding: 0 4px }
  .queue-title { font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 10px; text-align: center }
  .queue-list { display: flex; flex-direction: column; gap: 8px }
  .queue-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(4px);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
  }
  .queue-item.active {
    background: var(--surface);
    border-color: var(--surface);
    box-shadow: 0 4px 16px rgba(30,27,46,.1);
  }
  .queue-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--surface);
    flex-shrink: 0;
  }
  .queue-item.active .queue-num { background: var(--accent); color: var(--surface) }
  .queue-item.done .queue-num { background: var(--accent-secondary); color: var(--fg) }
  .queue-item-text { font-size: 14px; font-weight: 500; color: rgba(255,255,255,.7) }
  .queue-item.active .queue-item-text { color: var(--fg); font-weight: 600 }
  .queue-item.done .queue-item-text { color: rgba(255,255,255,.4); text-decoration: line-through }
  .queue-time { margin-right: auto; font-size: 12px; color: rgba(255,255,255,.35); direction: ltr }
  .queue-item.active .queue-time { color: var(--muted) }

  /* ── Tab bar ── */
  .tab-bar {
    display: flex; align-items: flex-end; justify-content: space-around;
    padding: 8px 16px 28px; background: rgba(255,255,255,.08);
    backdrop-filter: blur(12px);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; font-family: var(--font);
    font-size: 11px; color: rgba(255,255,255,.45); cursor: pointer; padding: 4px 8px;
  }
  .tab.active { color: var(--surface) }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  .tab.active svg { stroke-width: 2.2 }
  .fab {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(155,93,229,.35);
    cursor: pointer; margin-bottom: 8px;
  }
  .fab svg { width: 24px; height: 24px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
</style>
</head>
<body>
<div class="phone" data-od-id="phone-frame">
  <div class="main">
    <p class="task-label" data-od-id="task-label">משימה 1 מתוך 3</p>
    <h1 class="task-name" data-od-id="task-name">לערוך את הריל על פרידות</h1>

    <div class="timer-wrap" data-od-id="timer">
      <svg class="timer-ring" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="100"/>
        <circle class="ring-progress" id="ring" cx="110" cy="110" r="100"/>
      </svg>
      <div class="timer-text">
        <div class="timer-mins" id="timer-display">20:00</div>
        <div class="timer-secs">דקות</div>
      </div>
    </div>

    <div class="controls" data-od-id="controls">
      <button class="btn-start" id="startBtn" data-od-id="start-btn" onclick="toggle()">
        <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
      </button>
      <button class="btn-skip-task" data-od-id="skip-btn" onclick="nextTask()">משימה הבאה →</button>
    </div>

    <div class="queue" data-od-id="queue">
      <div class="queue-title">האינטרוולים שלך</div>
      <div class="queue-list" id="queueList">
        <div class="queue-item active">
          <div class="queue-num">1</div>
          <span class="queue-item-text">לערוך את הריל על פרידות</span>
          <span class="queue-time">20 דק׳</span>
        </div>
        <div class="queue-item">
          <div class="queue-num">2</div>
          <span class="queue-item-text">לענות לשלוש פניות מהדיירקט</span>
          <span class="queue-time">20 דק׳</span>
        </div>
        <div class="queue-item">
          <div class="queue-num">3</div>
          <span class="queue-item-text">משימה 3</span>
          <span class="queue-time">20 דק׳</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-bar" data-od-id="tab-bar">
    <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88"/></svg>המצפן</button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>תודות</button>
    <button class="fab"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>הרגלים</button>
    <button class="tab active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>עכשיו</button>
  </div>
</div>

<script>
var total = 20*60, left = total, running = false, iv = null, cur = 0;
var tasks = ['לערוך את הריל על פרידות','לענות לשלוש פניות מהדיירקט','משימה 3'];
var ring = document.getElementById('ring');
var circ = 2 * Math.PI * 100;
ring.style.strokeDasharray = circ;

function render() {
  var m = Math.floor(left/60), s = left%60;
  document.getElementById('timer-display').textContent =
    String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  ring.style.strokeDashoffset = circ * (1 - left/total);
  document.querySelector('.task-name').textContent = tasks[cur] || '';
  document.querySelector('.task-label').textContent = 'משימה '+(cur+1)+' מתוך '+tasks.length;
  document.querySelectorAll('.queue-item').forEach(function(el,i){
    el.className = 'queue-item' + (i===cur?' active':'') + (i<cur?' done':'');
  });
}
function toggle() {
  if (running) { clearInterval(iv); running=false; }
  else { running=true; iv=setInterval(function(){ if(left>0){left--;render();}else{clearInterval(iv);running=false;nextTask();}},1000); }
  var btn = document.getElementById('startBtn');
  btn.innerHTML = running
    ? '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="#9b5de5"/><rect x="14" y="4" width="4" height="16" fill="#9b5de5"/></svg>'
    : '<svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21" fill="#9b5de5"/></svg>';
}
function nextTask() {
  clearInterval(iv); running=false;
  cur++; if(cur>=tasks.length) cur=0;
  left=total; render();
  document.getElementById('startBtn').innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21" fill="#9b5de5"/></svg>';
}
render();
</script>
</body>
</html>
