<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — ברוכה הבאה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-lg: 24px;
    --radius-pill: 999px;
    --font: 'Assistant', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Phone frame ── */
  .phone {
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(30,27,46,.18);
  }

  /* ── Decorative blobs ── */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .45;
    pointer-events: none;
  }
  .blob-1 {
    width: 280px; height: 280px;
    background: var(--accent);
    top: -60px; left: -80px;
  }
  .blob-2 {
    width: 200px; height: 200px;
    background: #c084fc;
    bottom: 120px; right: -40px;
  }
  .blob-3 {
    width: 160px; height: 160px;
    background: var(--accent-secondary);
    bottom: -20px; left: 40px;
    opacity: .3;
  }

  /* ── Content layout ── */
  .content {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 32px 56px;
    text-align: center;
  }

  .top { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px }

  /* ── Logo / icon area ── */
  .logo-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, #c084fc 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(155,93,229,.35);
  }

  .logo-circle svg {
    width: 56px; height: 56px;
    fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ── Typography ── */
  .app-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  h1 {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.25;
    color: var(--fg);
  }

  .subtitle {
    font-size: 16px;
    font-weight: 400;
    color: var(--muted);
    line-height: 1.6;
    max-width: 280px;
  }

  /* ── CTA ── */
  .bottom { width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: center }

  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 56px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent-secondary);
    color: var(--fg);
    font-family: var(--font);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(52,211,153,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .cta:active { transform: scale(.97); box-shadow: 0 3px 12px rgba(52,211,153,.2) }

  .terms {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .terms a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }

  /* ── Step dots ── */
  .dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
  }
  .dot.active {
    width: 24px;
    border-radius: var(--radius-pill);
    background: var(--accent);
  }
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <!-- Atmosphere blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="content">
    <div class="top" data-od-id="welcome-hero">
      <!-- Sun/day icon -->
      <div class="logo-circle" data-od-id="logo-icon">
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="8"/>
          <line x1="24" y1="4" x2="24" y2="10"/>
          <line x1="24" y1="38" x2="24" y2="44"/>
          <line x1="4" y1="24" x2="10" y2="24"/>
          <line x1="38" y1="24" x2="44" y2="24"/>
          <line x1="9.9" y1="9.9" x2="14.1" y2="14.1"/>
          <line x1="33.9" y1="33.9" x2="38.1" y2="38.1"/>
          <line x1="9.9" y1="38.1" x2="14.1" y2="33.9"/>
          <line x1="33.9" y1="14.1" x2="38.1" y2="9.9"/>
        </svg>
      </div>

      <span class="app-name" data-od-id="app-name">היום שלי</span>

      <h1 data-od-id="welcome-heading">ברוכה הבאה!</h1>

      <p class="subtitle" data-od-id="welcome-subtitle">היום שלי עוזרת לך לנהל את היום בלי להרגיש מוצפת. צעד אחד בכל פעם.</p>
    </div>

    <div class="bottom" data-od-id="welcome-cta-area">
      <div class="dots" data-od-id="step-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <button class="cta" data-od-id="start-button">בואי נתחיל</button>

      <p class="terms" data-od-id="terms-text">בלחיצה על ״בואי נתחיל״ את מסכימה ל<a href="#">תנאי השימוש</a></p>
    </div>
  </div>
</div>

</body>
</html>
