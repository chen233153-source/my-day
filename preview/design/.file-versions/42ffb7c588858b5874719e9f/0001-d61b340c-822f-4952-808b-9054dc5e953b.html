<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — כתיבת תודות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0 }
  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --mint: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-lg: 24px;
    --pill: 999px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }
  body {
    font-family: var(--font); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 30% 12%, color-mix(in oklch, var(--accent) 20%, transparent), transparent 34%),
      radial-gradient(ellipse at 68% 88%, color-mix(in oklch, var(--accent-secondary) 14%, transparent), transparent 32%),
      var(--bg);
  }

  button, textarea { font: inherit }
  button { border: 0; cursor: pointer }

  .phone {
    width: 390px; height: 844px;
    background:
      radial-gradient(ellipse at 18% 7%, color-mix(in oklch, var(--surface) 26%, transparent), transparent 31%),
      radial-gradient(ellipse at 88% 24%, color-mix(in oklch, var(--accent-secondary) 16%, transparent), transparent 35%),
      radial-gradient(ellipse at 38% 74%, color-mix(in oklch, var(--bg) 24%, transparent), transparent 48%),
      linear-gradient(156deg, color-mix(in oklch, var(--fg) 78%, var(--accent)) 0%, color-mix(in oklch, var(--fg) 36%, var(--accent)) 30%, var(--accent) 58%, color-mix(in oklch, var(--accent) 55%, var(--bg)) 82%, var(--bg) 120%);
    border-radius: 44px; position: relative; overflow: hidden;
    box-shadow: 0 40px 80px color-mix(in oklch, var(--fg) 22%, transparent), 0 8px 24px color-mix(in oklch, var(--fg) 18%, transparent);
    display: flex; flex-direction: column;
  }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px 0;
    font-size: 11px; font-weight: 700;
    color: color-mix(in oklch, var(--surface) 52%, transparent);
    letter-spacing: .02em;
  }
  .status-icons { display: flex; align-items: center; gap: 5px; direction: ltr }
  .signal { width: 15px; height: 9px; display: flex; gap: 2px; align-items: end }
  .signal span { width: 3px; background: currentColor; border-radius: var(--pill) }
  .signal span:nth-child(1) { height: 4px }
  .signal span:nth-child(2) { height: 6px }
  .signal span:nth-child(3) { height: 8px }
  .battery { width: 18px; height: 9px; border: 1px solid currentColor; border-radius: 3px; position: relative }
  .battery::before { content: ''; position: absolute; left: -3px; top: 2px; width: 2px; height: 3px; border-radius: 1px; background: currentColor }
  .battery::after { content: ''; position: absolute; inset: 2px 3px 2px 2px; border-radius: 1px; background: currentColor }

  .scroll {
    flex: 1; overflow-y: auto;
    padding: 12px 20px 18px;
  }
  .scroll::-webkit-scrollbar { display: none }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 44px; margin: 2px 0 10px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 15px;
    display: grid; place-items: center;
    color: var(--surface);
    background: color-mix(in oklch, var(--surface) 12%, transparent);
    border: 1px solid color-mix(in oklch, var(--surface) 15%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform .15s cubic-bezier(.2,0,0,1), background .15s cubic-bezier(.2,0,0,1);
  }
  .icon-btn:active { transform: translateY(1px) scale(.98) }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .screen-kicker {
    color: color-mix(in oklch, var(--surface) 48%, transparent);
    font-size: 12px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
  }

  .hero {
    padding: 6px 2px 18px;
    display: grid; grid-template-columns: 1fr 70px;
    gap: 14px; align-items: center;
  }
  .hero-title {
    color: var(--surface);
    font-size: 34px; font-weight: 800;
    line-height: 1.08; letter-spacing: -0.02em;
    margin: 5px 0 8px;
  }
  .hero-copy {
    color: color-mix(in oklch, var(--surface) 68%, transparent);
    font-size: 14px; font-weight: 500; line-height: 1.55;
    max-width: 26ch;
  }
  .soft-orb {
    width: 70px; height: 70px; border-radius: 24px;
    position: relative; transform: rotate(-8deg);
    background: linear-gradient(145deg, var(--surface), color-mix(in oklch, var(--bg) 64%, var(--accent)));
    box-shadow: 0 18px 30px color-mix(in oklch, var(--fg) 18%, transparent), inset 0 1px 0 color-mix(in oklch, var(--surface) 72%, transparent);
  }
  .soft-orb::before,
  .soft-orb::after { content: ''; position: absolute; border-radius: var(--pill) }
  .soft-orb::before {
    width: 30px; height: 30px; right: 12px; top: 12px;
    background: var(--mint);
    box-shadow: -20px 24px 0 color-mix(in oklch, var(--accent) 48%, var(--surface));
  }
  .soft-orb::after {
    width: 38px; height: 8px; left: 12px; bottom: 10px;
    background: color-mix(in oklch, var(--fg) 18%, transparent);
  }

  .write-card {
    background: color-mix(in oklch, var(--surface) 15%, transparent);
    border-radius: 22px;
    border: 1px solid color-mix(in oklch, var(--surface) 18%, transparent);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: inset 0 1px 0 color-mix(in oklch, var(--surface) 16%, transparent);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-head {
    display: flex; align-items: start; justify-content: space-between;
    gap: 12px; margin-bottom: 14px;
  }
  .field-label {
    display: block;
    color: var(--surface);
    font-size: 16px; font-weight: 800;
    line-height: 1.25; letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .field-help {
    color: color-mix(in oklch, var(--surface) 58%, transparent);
    font-size: 12px; font-weight: 600; line-height: 1.45;
  }
  .save-state {
    min-height: 28px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    border-radius: var(--pill);
    color: var(--fg);
    background: color-mix(in oklch, var(--mint) 70%, var(--surface));
    font-size: 11px; font-weight: 800; letter-spacing: .02em;
    white-space: nowrap;
  }
  .save-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--fg);
    opacity: .62;
  }
  .save-state.saving .save-dot {
    animation: pulseSave .8s cubic-bezier(.2,0,0,1) infinite alternate;
  }

  .gratitude-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .gratitude-item {
    display: grid; grid-template-columns: 1fr 44px;
    gap: 8px; align-items: start;
    animation: itemIn .28s cubic-bezier(.2,0,0,1) both;
  }
  .textarea-wrap {
    position: relative;
    background: color-mix(in oklch, var(--surface) 86%, transparent);
    border: 1px solid color-mix(in oklch, var(--surface) 38%, transparent);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 10px 20px color-mix(in oklch, var(--fg) 8%, transparent), inset 0 1px 0 color-mix(in oklch, var(--surface) 74%, transparent);
  }
  textarea {
    width: 100%; min-height: 96px; resize: none;
    border: 0; outline: 0;
    background: transparent;
    color: var(--fg);
    padding: 14px 14px 28px;
    font-size: 15px; font-weight: 600; line-height: 1.55;
  }
  textarea::placeholder {
    color: color-mix(in oklch, var(--muted) 78%, transparent);
    font-weight: 600;
  }
  .textarea-wrap:focus-within {
    border-color: color-mix(in oklch, var(--mint) 76%, var(--surface));
    box-shadow: 0 14px 24px color-mix(in oklch, var(--fg) 12%, transparent), inset 0 0 0 1px color-mix(in oklch, var(--mint) 50%, transparent);
  }
  .char-count {
    position: absolute; left: 12px; bottom: 8px;
    color: var(--muted);
    font-size: 10px; font-weight: 700; letter-spacing: .02em;
    direction: ltr;
  }
  .delete-btn {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 15px;
    color: color-mix(in oklch, var(--surface) 72%, transparent);
    background: color-mix(in oklch, var(--surface) 10%, transparent);
    border: 1px solid color-mix(in oklch, var(--surface) 12%, transparent);
    transition: transform .15s cubic-bezier(.2,0,0,1), color .15s cubic-bezier(.2,0,0,1), background .15s cubic-bezier(.2,0,0,1);
  }
  .delete-btn:hover { color: var(--surface); background: color-mix(in oklch, var(--surface) 14%, transparent) }
  .delete-btn:active { transform: translateY(1px) scale(.96) }
  .delete-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }

  .add-row {
    width: 100%; min-height: 48px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 12px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, color-mix(in oklch, var(--mint) 72%, var(--surface)), color-mix(in oklch, var(--mint) 36%, var(--bg)));
    color: var(--fg);
    font-size: 13px; font-weight: 800; letter-spacing: .02em;
    box-shadow: 0 14px 24px color-mix(in oklch, var(--fg) 12%, transparent), inset 0 1px 0 color-mix(in oklch, var(--surface) 42%, transparent);
    transition: transform .15s cubic-bezier(.2,0,0,1), opacity .15s cubic-bezier(.2,0,0,1);
  }
  .add-row:active { transform: translateY(1px) scale(.985); opacity: .9 }
  .add-row svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round }

  .inspiration {
    display: grid; grid-template-columns: 34px 1fr;
    gap: 12px; align-items: center;
    padding: 12px 14px;
    border-radius: var(--radius);
    color: var(--surface);
    background: color-mix(in oklch, var(--surface) 10%, transparent);
    border: 1px solid color-mix(in oklch, var(--surface) 13%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    margin-bottom: 14px;
  }
  .tiny-gem {
    width: 34px; height: 34px; border-radius: 12px;
    display: grid; place-items: center;
    background: color-mix(in oklch, var(--surface) 14%, transparent);
    box-shadow: inset 0 1px 0 color-mix(in oklch, var(--surface) 20%, transparent);
  }
  .tiny-gem span {
    width: 17px; height: 17px;
    border-radius: 7px 11px 8px 12px;
    transform: rotate(12deg);
    background: linear-gradient(145deg, var(--surface), color-mix(in oklch, var(--accent) 46%, var(--bg)));
    box-shadow: 0 6px 10px color-mix(in oklch, var(--fg) 14%, transparent);
  }
  .inspiration small {
    display: block;
    color: color-mix(in oklch, var(--surface) 52%, transparent);
    font-size: 10px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 2px;
  }
  .inspiration p {
    color: color-mix(in oklch, var(--surface) 88%, transparent);
    font-size: 13px; font-weight: 700; line-height: 1.45;
  }

  .tab-bar {
    display: flex; align-items: center; justify-content: space-around;
    padding: 8px 16px 28px;
    background: color-mix(in oklch, var(--fg) 26%, transparent);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid color-mix(in oklch, var(--surface) 9%, transparent);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    min-width: 52px; min-height: 44px;
    background: none; border: none; font-family: var(--font);
    font-size: 11px; font-weight: 600;
    color: color-mix(in oklch, var(--surface) 42%, transparent);
    padding: 4px 8px; letter-spacing: .01em;
  }
  .tab.active { color: var(--mint) }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  .tab.active svg { stroke-width: 2.2 }
  .fab {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: var(--surface);
    display: grid; place-items: center;
    box-shadow: 0 14px 26px color-mix(in oklch, var(--fg) 18%, transparent);
    margin-bottom: 8px;
  }
  .fab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

  @keyframes itemIn {
    from { opacity: 0; transform: translateY(8px) scale(.98) }
    to { opacity: 1; transform: translateY(0) scale(1) }
  }
  @keyframes pulseSave {
    from { opacity: .45; transform: scale(.82) }
    to { opacity: 1; transform: scale(1) }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <main class="phone" data-od-id="gratitude-writing-screen">
    <div class="status-bar" data-od-id="status-bar">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <div class="signal"><span></span><span></span><span></span></div>
        <div class="battery"></div>
      </div>
    </div>

    <section class="scroll" data-od-id="gratitude-writing-content">
      <nav class="topbar" aria-label="ניווט מסך" data-od-id="gratitude-writing-topbar">
        <button class="icon-btn" type="button" aria-label="חזרה">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="screen-kicker">מסע ההערכה</span>
        <button class="icon-btn" type="button" aria-label="אפשרויות">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7h.01M12 12h.01M12 17h.01"/></svg>
        </button>
      </nav>

      <header class="hero" data-od-id="gratitude-writing-hero">
        <div>
          <p class="screen-kicker">רגע של 30 שניות</p>
          <h1 class="hero-title" data-od-id="gratitude-writing-title">כתבי תודה</h1>
          <p class="hero-copy" data-od-id="gratitude-writing-subtitle">אפשר אחת, אפשר כמה. כל מה שנכתב כאן נשמר לבד.</p>
        </div>
        <div class="soft-orb" aria-hidden="true"></div>
      </header>

      <section class="write-card" data-od-id="gratitude-writing-card">
        <div class="card-head">
          <div>
            <label class="field-label" for="gratitude-1" data-od-id="gratitude-input-label">התודות שלי היום</label>
            <p class="field-help">משפט אחד מספיק. אפשר להוסיף עוד כשבא.</p>
          </div>
          <div class="save-state" id="save-state" aria-live="polite" data-od-id="gratitude-autosave-state">
            <span class="save-dot"></span>
            <span>נשמר אוטומטית</span>
          </div>
        </div>

        <div class="gratitude-list" id="gratitude-list" data-od-id="gratitude-entry-list"></div>

        <button class="add-row" type="button" id="add-gratitude" data-od-id="add-gratitude-button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>הוסיפי עוד תודה</span>
        </button>
      </section>

      <aside class="inspiration" data-od-id="gratitude-inspiration-line">
        <div class="tiny-gem" aria-hidden="true"><span></span></div>
        <div>
          <small>שורת השראה</small>
          <p>היום אני שמה לב לטוב שכבר קיים.</p>
        </div>
      </aside>
    </section>

    <nav class="tab-bar" data-od-id="bottom-tab-bar" aria-label="ניווט ראשי">
      <button class="tab" type="button" data-od-id="tab-compass">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2.2 5.8L9 16l2.2-5.8z"/></svg>
        <span>המצפן</span>
      </button>
      <button class="tab active" type="button" data-od-id="tab-gratitude">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 5.6c-1.7-1.7-4.4-1.7-6.1 0L12 7.9 9.7 5.6c-1.7-1.7-4.4-1.7-6.1 0s-1.7 4.4 0 6.1L12 20l8.4-8.3c1.7-1.7 1.7-4.4 0-6.1z"/></svg>
        <span>תודות</span>
      </button>
      <button class="fab" type="button" aria-label="שיחה" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.7 8.7 0 0 1-3.8-.9L3 20l1.2-4.5A8.1 8.1 0 0 1 3 11.5a8.5 8.5 0 0 1 18 0z"/></svg>
      </button>
      <button class="tab" type="button" data-od-id="tab-habits">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="4"/><path d="M8.5 12l2.3 2.4 4.7-5"/></svg>
        <span>הרגלים</span>
      </button>
      <button class="tab" type="button" data-od-id="tab-now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>עכשיו</span>
      </button>
    </nav>
  </main>

<script>
  const STORAGE_KEY = 'today-gratitudes-v1';
  const list = document.getElementById('gratitude-list');
  const addButton = document.getElementById('add-gratitude');
  const saveState = document.getElementById('save-state');
  let saveTimer;

  function createId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return `gratitude-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function escapeHtml(value) {
    return value
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  function readEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [{ id: createId(), text: '' }];
      const saved = JSON.parse(raw);
      return Array.isArray(saved) && saved.length ? saved : [{ id: createId(), text: '' }];
    } catch {
      return [{ id: createId(), text: '' }];
    }
  }

  let entries = readEntries();

  function iconTrash() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>';
  }

  function setStatus(text, saving = false) {
    saveState.classList.toggle('saving', saving);
    saveState.querySelector('span:last-child').textContent = text;
  }

  function autosave() {
    clearTimeout(saveTimer);
    setStatus('שומרת...', true);
    saveTimer = window.setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        setStatus('נשמר אוטומטית', false);
      } catch {
        setStatus('לא נשמר כרגע', false);
      }
    }, 420);
  }

  function render(focusId) {
    list.innerHTML = entries.map((entry, index) => {
      const count = entry.text.length;
      const label = index === 0 ? 'התודה הראשונה שלי' : `תודה ${index + 1}`;
      const removable = entries.length > 1 || entry.text.trim().length > 0;
      const safeText = escapeHtml(entry.text);
      return `
        <div class="gratitude-item" data-od-id="gratitude-entry-${index + 1}">
          <div class="textarea-wrap">
            <textarea
              id="${index === 0 ? 'gratitude-1' : `gratitude-${index + 1}`}"
              maxlength="120"
              aria-label="${label}"
              data-id="${entry.id}"
              placeholder="${index === 0 ? 'אני מודה היום על...' : 'עוד תודה שעלתה לי...'}">${safeText}</textarea>
            <span class="char-count">${count}/120</span>
          </div>
          <button class="delete-btn" type="button" aria-label="מחיקת תודה" data-delete="${entry.id}" ${removable ? '' : 'disabled'}>${iconTrash()}</button>
        </div>
      `;
    }).join('');

    list.querySelectorAll('textarea').forEach(textarea => {
      textarea.addEventListener('input', event => {
        const id = event.target.dataset.id;
        const entry = entries.find(item => item.id === id);
        if (!entry) return;
        entry.text = event.target.value;
        event.target.parentElement.querySelector('.char-count').textContent = `${entry.text.length}/120`;
        autosave();
      });
    });

    list.querySelectorAll('[data-delete]').forEach(button => {
      button.addEventListener('click', event => {
        const id = event.currentTarget.dataset.delete;
        if (entries.length === 1) {
          entries = [{ ...entries[0], text: '' }];
        } else {
          entries = entries.filter(item => item.id !== id);
        }
        render();
        autosave();
      });
    });

    if (focusId) {
      const nextField = list.querySelector(`[data-id="${focusId}"]`);
      if (nextField) nextField.focus();
    }
  }

  addButton.addEventListener('click', () => {
    const last = entries[entries.length - 1];
    if (last && !last.text.trim()) {
      render(last.id);
      return;
    }
    const entry = { id: createId(), text: '' };
    entries.push(entry);
    render(entry.id);
    autosave();
  });

  render();
</script>
