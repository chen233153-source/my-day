<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי — כתיבת תודות</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0 }
  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --mint: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --radius: 16px;
    --radius-lg: 24px;
    --pill: 999px;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }
  body {
    font-family: var(--font); color: var(--fg);
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 30% 12%, color-mix(in oklch, var(--accent) 20%, transparent), transparent 34%),
      radial-gradient(ellipse at 68% 88%, color-mix(in oklch, var(--accent-secondary) 14%, transparent), transparent 32%),
      var(--bg);
  }

  button, textarea { font: inherit }
  button { border: 0; cursor: pointer }

  .phone {
    width: 390px; height: 844px;
    background:
      radial-gradient(ellipse at 18% 7%, color-mix(in oklch, var(--surface) 26%, transparent), transparent 31%),
      radial-gradient(ellipse at 88% 24%, color-mix(in oklch, var(--accent-secondary) 16%, transparent), transparent 35%),
      radial-gradient(ellipse at 38% 74%, color-mix(in oklch, var(--bg) 24%, transparent), transparent 48%),
      linear-gradient(156deg, color-mix(in oklch, var(--fg) 78%, var(--accent)) 0%, color-mix(in oklch, var(--fg) 36%, var(--accent)) 30%, var(--accent) 58%, color-mix(in oklch, var(--accent) 55%, var(--bg)) 82%, var(--bg) 120%);
    border-radius: 44px; position: relative; overflow: hidden;
    box-shadow: 0 40px 80px color-mix(in oklch, var(--fg) 22%, transparent), 0 8px 24px color-mix(in oklch, var(--fg) 18%, transparent);
    display: flex; flex-direction: column;
  }

  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px 0;
    font-size: 11px; font-weight: 700;
    color: color-mix(in oklch, var(--surface) 52%, transparent);
    letter-spacing: .02em;
  }
  .status-icons { display: flex; align-items: center; gap: 5px; direction: ltr }
  .signal { width: 15px; height: 9px; display: flex; gap: 2px; align-items: end }
  .signal span { width: 3px; background: currentColor; border-radius: var(--pill) }
  .signal span:nth-child(1) { height: 4px }
  .signal span:nth-child(2) { height: 6px }
  .signal span:nth-child(3) { height: 8px }
  .battery { width: 18px; height: 9px; border: 1px solid currentColor; border-radius: 3px; position: relative }
  .battery::before { content: ''; position: absolute; left: -3px; top: 2px; width: 2px; height: 3px; border-radius: 1px; background: currentColor }
  .battery::after { content: ''; position: absolute; inset: 2px 3px 2px 2px; border-radius: 1px; background: currentColor }

  .scroll {
    flex: 1; overflow-y: auto;
    padding: 12px 20px 18px;
  }
  .scroll::-webkit-scrollbar { display: none }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 44px; margin: 2px 0 8px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 15px;
    display: grid; place-items: center;
    color: var(--surface);
    background: color-mix(in oklch, var(--surface) 12%, transparent);
    border: 1px solid color-mix(in oklch, var(--surface) 15%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform .15s cubic-bezier(.2,0,0,1), background .15s cubic-bezier(.2,0,0,1);
  }
  .icon-btn:active { transform: translateY(1px) scale(.98) }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

  .screen-kicker {
    color: color-mix(in oklch, var(--surface) 50%, transparent);
    font-size: 11px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .hero {
    padding: 8px 2px 18px;
  }
  .hero-title {
    color: var(--surface);
    font-size: 33px; font-weight: 800;
    line-height: 1.08; letter-spacing: -0.02em;
    margin: 6px 0 8px;
  }
  .hero-copy {
    color: color-mix(in oklch, var(--surface) 70%, transparent);
    font-size: 14px; font-weight: 500; line-height: 1.55;
    max-width: 29ch;
  }

  .inspiration-card {
    margin: 0 0 12px;
    padding: 13px 16px 14px;
    border-radius: 20px;
    color: var(--surface);
    background:
      linear-gradient(135deg, color-mix(in oklch, var(--surface) 18%, transparent), color-mix(in oklch, var(--accent) 38%, transparent));
    border: 1px solid color-mix(in oklch, var(--surface) 22%, transparent);
    box-shadow: inset 0 1px 0 color-mix(in oklch, var(--surface) 28%, transparent);
  }
  .inspiration-label {
    display: block;
    margin-bottom: 5px;
    color: color-mix(in oklch, var(--surface) 66%, transparent);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .inspiration-text {
    font-size: 15px;
    font-weight: 800;
    line-height: 1.45;
    letter-spacing: -0.01em;
  }

  .note-card {
    background: color-mix(in oklch, var(--surface) 86%, transparent);
    border-radius: 22px;
    border: 1px solid color-mix(in oklch, var(--surface) 48%, transparent);
    box-shadow: 0 18px 32px color-mix(in oklch, var(--fg) 12%, transparent), inset 0 1px 0 color-mix(in oklch, var(--surface) 76%, transparent);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .note-head {
    padding: 15px 16px 12px;
    border-bottom: 1px solid color-mix(in oklch, var(--border) 76%, transparent);
  }
  .note-title {
    font-size: 15px; font-weight: 800;
    letter-spacing: -0.01em; line-height: 1.25;
    color: var(--fg);
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .gratitude-list {
    display: flex; flex-direction: column;
    min-height: 250px;
    padding: 7px 0;
  }
  .gratitude-row {
    display: grid; grid-template-columns: 30px 1fr 34px;
    gap: 9px; align-items: start;
    padding: 10px 13px 10px 14px;
    border-bottom: 1px solid color-mix(in oklch, var(--border) 58%, transparent);
    animation: rowIn .18s cubic-bezier(.2,0,0,1) both;
  }
  .gratitude-row:last-child { border-bottom: 0 }
  .line-number {
    min-width: 28px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--fg);
    background: var(--mint);
    border-radius: var(--pill);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .01em;
    margin-top: 1px;
  }
  .line-input {
    width: 100%; min-height: 30px; max-height: 130px;
    resize: none; overflow: hidden;
    border: 0; outline: 0; background: transparent;
    color: var(--fg);
    padding: 3px 0 0;
    font-size: 15px; font-weight: 600; line-height: 1.5;
  }
  .line-input::placeholder {
    color: color-mix(in oklch, var(--muted) 74%, transparent);
    font-weight: 600;
  }
  .delete-btn {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 12px;
    color: color-mix(in oklch, var(--muted) 70%, transparent);
    background: transparent;
    opacity: .58;
    transition: transform .15s cubic-bezier(.2,0,0,1), opacity .15s cubic-bezier(.2,0,0,1), color .15s cubic-bezier(.2,0,0,1);
  }
  .delete-btn:hover,
  .delete-btn:focus-visible {
    opacity: 1;
    color: var(--accent);
  }
  .delete-btn[disabled] {
    opacity: 0;
    pointer-events: none;
  }
  .delete-btn:active { transform: translateY(1px) scale(.96) }
  .delete-btn svg {
    width: 17px; height: 17px;
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .tab-bar {
    display: flex; align-items: center; justify-content: space-around;
    padding: 8px 16px 28px;
    background: color-mix(in oklch, var(--fg) 26%, transparent);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid color-mix(in oklch, var(--surface) 9%, transparent);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    min-width: 52px; min-height: 44px;
    background: none; border: none; font-family: var(--font);
    font-size: 11px; font-weight: 600;
    color: color-mix(in oklch, var(--surface) 42%, transparent);
    padding: 4px 8px; letter-spacing: .01em;
  }
  .tab.active { color: var(--mint) }
  .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  .tab.active svg { stroke-width: 2.2 }
  .fab {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: var(--surface);
    display: grid; place-items: center;
    box-shadow: 0 14px 26px color-mix(in oklch, var(--fg) 18%, transparent);
    margin-bottom: 8px;
  }
  .fab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(5px) }
    to { opacity: 1; transform: translateY(0) }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <main class="phone" data-od-id="gratitude-writing-screen">
    <div class="status-bar" data-od-id="status-bar">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <div class="signal"><span></span><span></span><span></span></div>
        <div class="battery"></div>
      </div>
    </div>

    <section class="scroll" data-od-id="gratitude-writing-content">
      <nav class="topbar" aria-label="ניווט מסך" data-od-id="gratitude-writing-topbar">
        <button class="icon-btn" type="button" aria-label="חזרה">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="screen-kicker">מסע ההערכה</span>
        <button class="icon-btn" type="button" aria-label="אפשרויות">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7h.01M12 12h.01M12 17h.01"/></svg>
        </button>
      </nav>

      <header class="hero" data-od-id="gratitude-writing-hero">
        <p class="screen-kicker">רשימת תודה</p>
        <h1 class="hero-title" data-od-id="gratitude-writing-title">כתבי מה טוב היום</h1>
        <p class="hero-copy" data-od-id="gratitude-writing-subtitle">כל שורה היא תודה קטנה אחת. אפשר לכתוב כמה שעולות.</p>
      </header>

      <aside class="inspiration-card" data-od-id="gratitude-inspiration-card">
        <span class="inspiration-label">משפט השראה</span>
        <p class="inspiration-text">היום אני שמה לב לטוב שכבר קיים.</p>
      </aside>

      <section class="note-card" data-od-id="gratitude-note-card">
        <div class="note-head" data-od-id="gratitude-note-head">
          <h2 class="note-title">התודות שלי היום</h2>
          <div class="sr-only" id="save-state" aria-live="polite" data-od-id="gratitude-autosave-state"></div>
        </div>

        <div class="gratitude-list" id="gratitude-list" role="list" data-od-id="gratitude-list"></div>
      </section>
    </section>

    <nav class="tab-bar" data-od-id="bottom-tab-bar" aria-label="ניווט ראשי">
      <button class="tab" type="button" data-od-id="tab-compass">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2.2 5.8L9 16l2.2-5.8z"/></svg>
        <span>המצפן</span>
      </button>
      <button class="tab active" type="button" data-od-id="tab-gratitude">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 5.6c-1.7-1.7-4.4-1.7-6.1 0L12 7.9 9.7 5.6c-1.7-1.7-4.4-1.7-6.1 0s-1.7 4.4 0 6.1L12 20l8.4-8.3c1.7-1.7 1.7-4.4 0-6.1z"/></svg>
        <span>תודות</span>
      </button>
      <button class="fab" type="button" aria-label="שיחה" data-od-id="tab-chat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.7 8.7 0 0 1-3.8-.9L3 20l1.2-4.5A8.1 8.1 0 0 1 3 11.5a8.5 8.5 0 0 1 18 0z"/></svg>
      </button>
      <button class="tab" type="button" data-od-id="tab-habits">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="4"/><path d="M8.5 12l2.3 2.4 4.7-5"/></svg>
        <span>הרגלים</span>
      </button>
      <button class="tab" type="button" data-od-id="tab-now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>עכשיו</span>
      </button>
    </nav>
  </main>

<script>
  const STORAGE_KEY = 'today-gratitudes-v2';
  const legacyKey = 'today-gratitudes-v1';
  const list = document.getElementById('gratitude-list');
  const saveState = document.getElementById('save-state');
  let saveTimer;

  function createId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return `gratitude-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function escapeHtml(value) {
    return value
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  function blankEntry() {
    return { id: createId(), text: '' };
  }

  function normalizeEntry(entry) {
    if (!entry || typeof entry !== 'object') return blankEntry();
    return {
      id: entry.id || createId(),
      text: typeof entry.text === 'string' ? entry.text : ''
    };
  }

  function readEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(legacyKey);
      if (!raw) return [blankEntry()];
      const saved = JSON.parse(raw);
      if (!Array.isArray(saved) || !saved.length) return [blankEntry()];
      return saved.map(normalizeEntry);
    } catch {
      return [blankEntry()];
    }
  }

  let entries = readEntries();

  function iconTrash() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>';
  }

  function setStatus(text, saving = false) {
    saveState.textContent = text;
  }

  function autosave() {
    clearTimeout(saveTimer);
    setStatus('שומרת...', true);
    saveTimer = window.setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        setStatus('נשמר אוטומטית', false);
      } catch {
        setStatus('לא נשמר כרגע', false);
      }
    }, 360);
  }

  function resizeInput(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = `${textarea.scrollHeight}px`;
  }

  function addAfter(id) {
    const index = entries.findIndex(entry => entry.id === id);
    const next = blankEntry();
    if (index === -1) {
      entries.push(next);
    } else {
      entries.splice(index + 1, 0, next);
    }
    render(next.id);
    autosave();
  }

  function removeEntry(id) {
    const index = entries.findIndex(entry => entry.id === id);
    if (index === -1) return;
    const previous = entries[index - 1]?.id || entries[index + 1]?.id;
    if (entries.length === 1) {
      entries = [blankEntry()];
      render(entries[0].id);
    } else {
      entries.splice(index, 1);
      render(previous);
    }
    autosave();
  }

  function render(focusId) {
    list.innerHTML = entries.map((entry, index) => {
      const safeText = escapeHtml(entry.text);
      const label = index === 0 ? 'התודה הראשונה שלי' : `תודה ${index + 1}`;
      const removable = entries.length > 1 || entry.text.trim().length > 0;
      return `
        <div class="gratitude-row" role="listitem" data-od-id="gratitude-row-${index + 1}">
          <span class="line-number" aria-hidden="true">${index + 1}</span>
          <textarea
            class="line-input"
            rows="1"
            maxlength="160"
            aria-label="${label}"
            data-id="${entry.id}"
            placeholder="${index === 0 ? 'אני מודה היום על...' : 'עוד תודה...'}">${safeText}</textarea>
          <button class="delete-btn" type="button" aria-label="מחיקת תודה" data-delete="${entry.id}" ${removable ? '' : 'disabled'}>${iconTrash()}</button>
        </div>
      `;
    }).join('');

    list.querySelectorAll('textarea').forEach(textarea => {
      resizeInput(textarea);
      textarea.addEventListener('input', event => {
        const id = event.target.dataset.id;
        const entry = entries.find(item => item.id === id);
        if (!entry) return;
        entry.text = event.target.value;
        resizeInput(event.target);
        autosave();
      });

      textarea.addEventListener('keydown', event => {
        const id = event.target.dataset.id;
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          addAfter(id);
        }
        if (event.key === 'Backspace' && !event.target.value.trim() && entries.length > 1) {
          event.preventDefault();
          removeEntry(id);
        }
      });
    });

    list.querySelectorAll('[data-delete]').forEach(button => {
      button.addEventListener('click', event => {
        removeEntry(event.currentTarget.dataset.delete);
      });
    });

    if (focusId) {
      const nextField = list.querySelector(`[data-id="${focusId}"]`);
      if (nextField) {
        nextField.focus();
        nextField.selectionStart = nextField.value.length;
        nextField.selectionEnd = nextField.value.length;
      }
    }
  }

  render();
</script>
</body>
</html>
