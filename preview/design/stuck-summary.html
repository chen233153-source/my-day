<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - תקועה, סיכום</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<!-- 17 · תקועה, סיכום. גיליון תחתון מעל רגע הפעולה.
     המשימה החדשה, שתי הצעות לגרסה קטנה, ושתי דרכים לצאת מכאן. -->
<main class="phone" data-od-id="stuck-summary-screen">

  <!-- ההקשר שמתחת: רגע הפעולה, מעומעם ולא אינטראקטיבי -->
  <section class="content" data-od-id="action-context" inert aria-hidden="true">
    <div class="top-bar" data-od-id="context-top-bar">
      <span class="step-label">המשימה שלך עכשיו</span>
    </div>
    <div class="white-card" data-od-id="context-task">
      <strong>לענות לשלוש פניות מהדיירקט</strong>
      <p>20 דקות על הטיימר</p>
    </div>
    <div class="scroll center" data-od-id="context-countdown">
      <div class="breath-circle"><span dir="ltr">5 · 4 · 3 · 2 · 1</span></div>
    </div>
  </section>

  <aside class="sheet" data-od-id="stuck-summary-sheet">
    <div class="contract" data-od-id="new-task">זו המשימה החדשה. המטרה בהתחלה היא לא לעשות הרבה, אלא להופיע.</div>

    <div class="cards" data-od-id="task-versions">
      <button class="choice-card plain" data-od-id="version-hook">
        <span class="card-text"><strong>רק ההוק והשורה הראשונה</strong></span>
      </button>
      <button class="choice-card plain" data-od-id="version-camera">
        <span class="card-text"><strong>להדליק מצלמה ולומר משפט אחד</strong></span>
      </button>
    </div>

    <button class="cta secondary" data-od-id="replace-task" data-target="today-day.html">להחליף את המשימה בזה</button>
    <button class="cta quiet" data-od-id="start-countdown" data-target="action-countdown.html"><span><bdi dir="ltr">5-4-3-2-1</bdi>, מתחילה</span></button>

    <p class="text-link" role="button" tabindex="0" data-od-id="close" data-target="today-day.html">סגרי</p>

    <p class="fine-print" data-od-id="sources">Finish · Jon Acuff + הרגלים אטומיים · James Clear</p>
  </aside>
</main>
<script>
  document.querySelectorAll('[data-target]').forEach(function (el) {
    el.addEventListener('click', function () { location.href = el.dataset.target; });
  });
</script>
</body>
</html>
