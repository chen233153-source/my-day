<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - בוקר</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="today-morning-screen">
  <section class="content with-tabs">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">שני, 27 ביולי</span>
    </div>

    <header class="heading" data-od-id="morning-greeting">
      <h1 data-od-id="screen-title">בוקר טוב, מיכל</h1>
      <p class="subtitle">אני אדם שכותב</p>
    </header>

    <div class="scroll" data-od-id="morning-body">
      <div class="hero-card" data-od-id="now-action">
        <strong>שגרת הבוקר שלך</strong>
        <p>שתי דרכים. שתיהן נחשבות.</p>
        <div class="btn-row" data-od-id="morning-routine-actions">
          <button class="cta" data-od-id="start-full-morning">הבוקר שלי</button>
          <button class="cta" data-od-id="start-short-morning">גרסה קצרה</button>
        </div>
      </div>

      <div class="quiet" data-od-id="what-else-today">
        <span class="quiet-label">מה עוד היום</span>
        <p>לכתוב 500 מילים לפרק השני</p>
        <p>לשלוח את ההצעה ללקוח</p>
        <p>לקבוע שיחה עם דנה</p>
      </div>

      <div class="cards" data-od-id="setup-prompt">
        <button class="choice-card" data-od-id="setup-goals">
          <span class="radio"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span class="card-text"><strong>לסמן מטרה לרבעון</strong><span>מכאן נבחר שלוש פעולות לשבוע</span></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span>
        </button>
      </div>
    </div>

    <div class="bottom" data-od-id="doors">
      <div class="pill-row">
        <button class="pill" data-od-id="door-stuck">תקועה</button>
        <button class="pill" data-od-id="door-calm">רגיעה</button>
      </div>
    </div>
  </section>

  <nav class="tab-bar" data-od-id="tab-bar">
    <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-4 6-2-3"/></svg><span>המצפן</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/></svg><span>משימות</span></button>
    <button class="fab" aria-label="שיחה"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 01-4 4H8l-5 3V7a4 4 0 014-4h10a4 4 0 014 4z"/></svg></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8 14a6 6 0 118 0c-1 1-1 2-1 3H9c0-1 0-2-1-3z"/></svg><span>הרגלים</span></button>
    <button class="tab active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>היום שלי</span></button>
  </nav>
</main>
</body>
</html>
