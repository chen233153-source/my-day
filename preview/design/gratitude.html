<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - תודות</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="gratitude-screen">
  <section class="content with-tabs">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">שני, 27 ביולי</span>
    </div>

    <header class="heading" data-od-id="gratitude-heading">
      <h1 data-od-id="screen-title">תודות</h1>
      <p class="subtitle">משהו קטן שקרה היום, וטוב שהוא קרה.</p>
    </header>

    <div class="scroll" data-od-id="gratitude-body">
      <div class="field" data-od-id="gratitude-input">
        <label for="gratitude-today">התודה של היום</label>
        <textarea id="gratitude-today" placeholder=""></textarea>
      </div>

      <div class="quiet" data-od-id="gratitude-entry-1">
        <span class="quiet-label">אתמול</span>
        <p>דנה התקשרה בלי סיבה ודיברנו עשרים דקות.</p>
      </div>

      <div class="quiet" data-od-id="gratitude-entry-2">
        <span class="quiet-label">שבת, 25 ביולי</span>
        <p>ישנתי עד מאוחר ואף אחד לא היה צריך אותי.</p>
      </div>

      <div class="quiet" data-od-id="gratitude-entry-3">
        <span class="quiet-label">חמישי, 23 ביולי</span>
        <p>סיימתי את ההצעה שנמרחה שבועיים.</p>
      </div>

      <div class="quiet" data-od-id="gratitude-entry-4">
        <span class="quiet-label">רביעי, 22 ביולי</span>
        <p>הקפה של הבוקר יצא בדיוק כמו שאני אוהבת.</p>
      </div>
    </div>

    <div class="bottom">
      <button class="cta" data-od-id="save-gratitude-button">לשמור</button>
    </div>
  </section>

  <nav class="tab-bar" data-od-id="tab-bar">
    <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-4 6-2-3"/></svg><span>המצפן</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/></svg><span>משימות</span></button>
    <button class="fab" aria-label="שיחה"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 01-4 4H8l-5 3V7a4 4 0 014-4h10a4 4 0 014 4z"/></svg></button>
    <button class="tab active"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8 14a6 6 0 118 0c-1 1-1 2-1 3H9c0-1 0-2-1-3z"/></svg><span>הרגלים</span></button>
    <button class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>היום שלי</span></button>
  </nav>
</main>
</body>
</html>
