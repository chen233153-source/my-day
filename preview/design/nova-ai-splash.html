<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nova AI — Splash</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #ede9fe;
    --fg: #1e1b2e;
    --accent: #9b5de5;
    --accent-secondary: #34d399;
    --surface: #ffffff;
    --muted: #8b85a1;
    --border: #d4cfe8;
    --font: 'Assistant', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  html, body { height: 100%; overflow: hidden }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 390px; height: 844px;
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(30,27,46,.18);
    background: linear-gradient(160deg, #c084fc 0%, var(--accent) 40%, #6d28d9 100%);
  }

  /* ── Atmosphere ── */
  .glow {
    position: absolute; border-radius: 50%; pointer-events: none;
    filter: blur(80px);
  }
  .glow-1 { width: 320px; height: 320px; background: rgba(192,132,252,.5); top: -80px; left: -60px }
  .glow-2 { width: 260px; height: 260px; background: rgba(52,211,153,.25); bottom: -40px; right: -80px }
  .glow-3 { width: 200px; height: 200px; background: rgba(109,40,217,.4); top: 50%; left: 50%; transform: translate(-50%,-50%) }

  /* ── Ring pattern ── */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.08);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
  }
  .ring-1 { width: 500px; height: 500px }
  .ring-2 { width: 380px; height: 380px; border-color: rgba(255,255,255,.06) }
  .ring-3 { width: 260px; height: 260px; border-color: rgba(255,255,255,.04) }

  /* ── Content ── */
  .content {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    text-align: center;
  }

  /* ── Logo mark ── */
  .logo-mark {
    width: 96px; height: 96px;
    background: var(--surface);
    border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 48px rgba(30,27,46,.25), 0 0 0 1px rgba(255,255,255,.15);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) }
    50% { transform: translateY(-8px) }
  }

  .logo-mark svg {
    width: 52px; height: 52px;
  }

  /* ── Wordmark ── */
  .wordmark {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .app-name {
    font-size: 38px; font-weight: 800;
    color: var(--surface);
    letter-spacing: -.01em;
    direction: ltr;
  }
  .app-name span {
    font-weight: 400;
    opacity: .75;
  }
  .tagline {
    font-size: 15px; font-weight: 500;
    color: rgba(255,255,255,.6);
    direction: ltr;
  }

  /* ── Bottom loader ── */
  .loader-area {
    position: absolute; bottom: 80px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .loader-bar {
    width: 120px; height: 3px;
    background: rgba(255,255,255,.15);
    border-radius: 999px;
    overflow: hidden;
  }
  .loader-fill {
    width: 40%; height: 100%;
    background: var(--accent-secondary);
    border-radius: 999px;
    animation: load 1.8s ease-in-out infinite;
  }
  @keyframes load {
    0% { width: 10%; margin-right: 90% }
    50% { width: 60%; margin-right: 20% }
    100% { width: 10%; margin-right: 0 }
  }
</style>
</head>
<body>

<div class="phone" data-od-id="phone-frame">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <div class="content" data-od-id="splash-content">
    <div class="logo-mark" data-od-id="logo-mark">
      <svg viewBox="0 0 48 48" fill="none">
        <!-- N shape with gradient -->
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0%" stop-color="#9b5de5"/>
            <stop offset="100%" stop-color="#6d28d9"/>
          </linearGradient>
        </defs>
        <path d="M12 38V10l24 28V10" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- AI sparkle -->
        <circle cx="38" cy="12" r="3" fill="#34d399"/>
        <circle cx="38" cy="12" r="5" fill="none" stroke="#34d399" stroke-width="1" opacity=".4"/>
      </svg>
    </div>

    <div class="wordmark" data-od-id="wordmark">
      <div class="app-name">Nova <span>AI</span></div>
      <div class="tagline">Your intelligent companion</div>
    </div>
  </div>

  <div class="loader-area" data-od-id="loader">
    <div class="loader-bar">
      <div class="loader-fill"></div>
    </div>
  </div>
</div>

</body>
</html>
