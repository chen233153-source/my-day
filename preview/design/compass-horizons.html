<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - שכבות הכיוון</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="compass-horizons-screen">
  <section class="content">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">המצפן</span>
      <button class="back-btn" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>

    <header class="heading" data-od-id="horizons-heading">
      <h1 data-od-id="screen-title">שכבות הכיוון</h1>
      <p class="subtitle">המקום שבו מסתכלים רחוק. אחרי שהשבוע כבר עובד.</p>
    </header>

    <div class="empty" data-od-id="horizons-locked">
      <span class="empty-icon"><svg viewBox="0 0 24 24"><path d="M6 11h12v9H6z"/><path d="M9 11V8a3 3 0 016 0v3"/></svg></span>
      <strong>תוכנית ארוכת טווח</strong>
      <p>נפתח בסוף המחזור הנוכחי</p>
    </div>

    <div class="bottom">
      <button class="cta" data-od-id="back-to-week-button">מה זז השבוע</button>
    </div>
  </section>
</main>
</body>
</html>
