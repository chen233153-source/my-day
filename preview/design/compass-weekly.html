<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - הפגישה השבועית</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="compass-weekly-screen">
  <section class="content">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">הפגישה השבועית</span>
      <button class="back-btn" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>

    <header class="heading" data-od-id="weekly-heading">
      <h1 data-od-id="screen-title">מה עשית השבוע?</h1>
      <p class="subtitle">רק מה שהתחייבת לעשות. לא מה שיצא מזה.</p>
    </header>

    <div class="scroll" data-od-id="weekly-body">
      <section class="cards" data-od-id="weekly-actions">
        <div class="choice-card selected" data-od-id="weekly-action-1">
          <span class="radio"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span class="card-text"><strong>לשלוח חמש הודעות ללקוחות</strong><span><bdi>5</bdi> מתוך 5</span></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 01-4 4H8l-5 3V7a4 4 0 014-4h10a4 4 0 014 4z"/></svg></span>
        </div>
        <div class="choice-card" data-od-id="weekly-action-2">
          <span class="radio"></span>
          <span class="card-text"><strong>לכתוב 500 מילים</strong><span><bdi>4</bdi> מתוך 5</span></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M14 6l4 4"/></svg></span>
        </div>
        <div class="choice-card" data-od-id="weekly-action-3">
          <span class="radio"></span>
          <span class="card-text"><strong>שעה אחת ממוקדת על העמוד</strong><span><bdi>2</bdi> מתוך 3</span></span>
          <span class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        </div>
      </section>

      <!-- ה · היה `white-card`, לבן מלא באותו טור עם כרטיס האופציה הנבחר.
           `.quiet` בדיוק כמו בלוקי הסיכום ב-compass-home. -->
      <div class="quiet" data-od-id="weekly-summary">
        <span class="quiet-label"><bdi>11</bdi> מתוך 13</span>
        <p>מה חסם?</p>
      </div>
    </div>

    <div class="bottom" data-od-id="weekly-actions-bottom">
      <button class="cta" data-od-id="next-part">הלאה</button>
    </div>
  </section>
</main>
</body>
</html>
