<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>היום שלי - פגישת האמן</title>
<link rel="stylesheet" href="habit-flow.css">
</head>
<body>
<main class="phone" data-od-id="artist-date-screen">
  <section class="content">
    <div class="top-bar" data-od-id="top-bar">
      <span class="step-label">פעם בשבוע</span>
      <button class="back-btn" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>

    <header class="heading" data-od-id="artist-date-heading">
      <h1>יציאה לבד השבוע</h1>
      <p class="subtitle">לא משימה ולא משהו מועיל. משהו שסתם מסקרן אותך.</p>
    </header>

    <div class="scroll" data-od-id="artist-date-body">
      <div class="field" data-od-id="idea-bank">
        <label>רעיונות</label>
        <div class="pill-row">
          <button class="pill">מוזיאון</button>
          <button class="pill active">שכונה שלא הכרת</button>
          <button class="pill">חנות ספרים</button>
          <button class="pill">טבע</button>
          <button class="pill">חנות חומרי יצירה</button>
          <button class="pill">סרט באמצע היום</button>
          <button class="pill" data-od-id="add-idea">להוסיף רעיון</button>
        </div>
      </div>

      <div class="field" data-od-id="pick-day-hour">
        <label>יום ושעה, כמו כל פגישה אחרת</label>
        <div class="pill-row">
          <button class="pill day">א</button>
          <button class="pill day">ב</button>
          <button class="pill day">ג</button>
          <button class="pill day">ד</button>
          <button class="pill day active">ה</button>
          <button class="pill day">ו</button>
          <button class="pill day">ש</button>
        </div>
        <div class="pill-row">
          <button class="pill">10:00</button>
          <button class="pill active">16:00</button>
          <button class="pill">20:00</button>
        </div>
      </div>

      <div class="field" data-od-id="after-question">
        <label for="reflection">מה זה עורר בך?</label>
        <input id="reflection" value="יצאתי עם דנה. היה כיף.">
      </div>

      <div class="white-card" data-od-id="alone-rule">
        <p>בפעם הבאה נסי לבד. זה עובד אחרת.</p>
      </div>
    </div>

    <div class="bottom">
      <button class="cta" data-od-id="reserve-button">לשריין ביומן</button>
    </div>
  </section>
</main>
</body>
</html>
