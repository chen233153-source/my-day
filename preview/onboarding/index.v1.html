<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>אב טיפוס · אונבורדינג</title>
<link rel="stylesheet" href="../design/habit-flow.css">
<style>
  /* הרחבות לאב הטיפוס בלבד. לא חלק ממערכת העיצוב. */
  body { display: grid; place-items: center; min-height: 100vh; }
  .stage { display: grid; place-items: center; gap: 14px; }
  .src {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 32px 16px; text-align: center;
    font-size: 11px; line-height: 1.5;
    color: color-mix(in oklch, var(--surface) 62%, transparent);
  }
  /* המסך עם שש כרטיסיות SAVERS גולש ב-47px. מסך אמיתי נגלל. */
  .content { padding-bottom: 96px; overflow-y: auto; overscroll-behavior: contain; }
  .checks { display: grid; gap: 7px; margin-top: 12px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700;
    color: color-mix(in oklch, var(--surface) 62%, transparent); }
  .chk.on { color: var(--accent-secondary); }
  .chk i { width: 17px; height: 17px; border-radius: 50%; display: inline-grid; place-items: center;
    border: 1.5px solid currentColor; font-size: 10px; font-style: normal; flex: 0 0 auto; }
  .chk.on i { background: var(--accent-secondary); color: var(--fg); border-color: transparent; }
  .why-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .why-row .field { flex: 1; margin: 0; }
  .why-row .n { width: 22px; text-align: center; font-weight: 800;
    color: color-mix(in oklch, var(--surface) 62%, transparent); }
  .zones { display: grid; gap: 10px; }
  .tiny-opts { display: grid; gap: 8px; margin-top: 10px; }
  .summary { display: grid; gap: 12px; }
  .sum-card { background: color-mix(in oklch, var(--surface) 12%, transparent);
    border: 1px solid color-mix(in oklch, var(--surface) 20%, transparent);
    border-radius: var(--radius); padding: 13px 15px; }
  .sum-card h4 { font-size: 13px; font-weight: 800; margin-bottom: 6px;
    color: color-mix(in oklch, var(--surface) 70%, transparent); }
  .sum-card p { font-size: 15px; font-weight: 700; color: var(--surface); }
  .bar { display: flex; gap: 8px; align-items: center; justify-content: center;
    font-size: 13px; color: #6b6862; }
  .bar button { font: inherit; border: 1px solid #e0ddd7; background: #fff; border-radius: 999px;
    padding: 5px 13px; cursor: pointer; }
  .map { max-width: 390px; font-size: 12.5px; color: #6b6862; text-align: center; line-height: 1.6 }
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="content" id="screen"></div><div class="src" id="src"></div></div>
  <div class="bar">
    <button id="prev">← אחורה</button>
    <span id="pos"></span>
    <button id="restart">להתחיל מחדש</button>
  </div>
  <div class="map" id="map"></div>
</div>

<script>
/* ── מצב. אותו מבנה שהוצע במפרט ── */
const S = { cycleStart:'', goals:[], identity:'', habits:[], breakHabit:null,
            morning:{savers:[],minutes:20,wakeSteps:[],pages:false,artistDate:''},
            week:{big3:[]} };
let gi = 0, hi = 0;               // אינדקס המטרה וההרגל שנערכים כרגע
let i = 0;                        // המסך הנוכחי

const el = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const g = () => S.goals[gi] || (S.goals[gi] = {title:'',metric:'',due:'',zone:'',why:['','',''],tactics:['','']});
const h = () => S.habits[hi] || (S.habits[hi] = {behavior:'',tiny:'',anchor:'',time:'',celebration:''});

const head = (eyebrow, title, sub) => `
  <div class="top-bar"><button class="back-btn" onclick="back()">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="step-label">${esc(eyebrow)}</span></div>
  <div class="heading"><h1>${esc(title)}</h1>
    ${sub?`<p class="subtitle">${esc(sub)}</p>`:''}</div>`;

const cta = (txt, extra='') => `<div class="bottom">
  <button class="cta" onclick="next()">${esc(txt)}</button>${extra}</div>`;

/* ── רשימת המסכים. לכל מסך: מאיזה מדריך ואיזה תרגיל ── */
const SCREENS = [
{ src:'תכנון חיים ומטרות · 12 Week Year, צעדים 1-2',
  view:()=>head('שלב 1 מתוך 4','12 שבועות, לא שנה',
    'שנה שלמה מייצרת שפע זמן מדומה ודחיינות. כשמגדירים 12 שבועות כמחזור שלם, כל שבוע נחשב.')+`
  <div class="field"><label for="cs">מתי מתחילים</label>
    <input id="cs" type="date" value="${S.cycleStart}" oninput="S.cycleStart=this.value"></div>
  <div class="hero-card"><p>עד שלוש מטרות למחזור. לא יותר. זו התכונה, לא המגבלה.</p></div>`
  + cta('להגדיר את המטרה הראשונה') },

{ src:'תכנון חיים ומטרות · Your Best Year Ever, תרגיל 3 (SMARTER)',
  view:()=>{const G=g();
   const ok1=G.title.trim().length>7, ok2=/\d/.test(G.metric), ok3=!!G.due;
   const c=(on,t)=>`<div class="chk ${on?'on':''}"><i>${on?'✓':''}</i>${t}</div>`;
   return head(`מטרה ${gi+1} מתוך 3`,'מה את רוצה שיקרה',
    'האפליקציה בודקת תוך כדי הכתיבה. מטרה טובה היא ספציפית, מדידה, ועם תאריך בתוך המחזור.')+`
   <div class="field"><label for="gt">המטרה</label>
     <input id="gt" placeholder="למשל: להביא 12 לקוחות חדשים" value="${esc(G.title)}"
       oninput="g().title=this.value;draw()"></div>
   <div class="field"><label for="gm">איך נדע שהיא הושגה</label>
     <input id="gm" placeholder="מספר. למשל: 12 לקוחות" value="${esc(G.metric)}"
       oninput="g().metric=this.value;draw()"></div>
   <div class="field"><label for="gd">תאריך יעד</label>
     <input id="gd" type="date" value="${G.due}" oninput="g().due=this.value;draw()"></div>
   <div class="checks">${c(ok1,'ספציפית')}${c(ok2,'מדידה')}${c(ok3,'עם תאריך')}</div>`
   + cta('הלאה')} },

{ src:'תכנון חיים ומטרות · SMARTER, האות R (Risky)',
  view:()=>{const G=g();
   const z=(k,t,d)=>`<button class="choice-card plain ${G.zone===k?'selected':''}"
     onclick="g().zone='${k}';draw()"><span class="card-text"><strong>${t}</strong><span>${d}</span></span></button>`;
   return head('מבחן הסיכון','זו מטרה נוחה או מותחת?',
    'מטרה שנוחה לך לא תזיז אותך. מטרה דמיונית תשבור אותך. הצמיחה קורית באמצע.')+`
   <div class="zones">
     ${z('comfort','אזור נוחות','אני יודעת בוודאות שאשיג אותה')}
     ${z('stretch','אזור אי-נוחות','אפשרי, אבל אצטרך לעבוד אחרת')}
     ${z('delusion','אזור אשליה','גם אם הכל ילך מושלם, לא סביר')}
   </div>
   ${G.zone==='comfort'?`<div class="hero-card"><p>זו קלה מדי. אפשר להגדיל את המספר?</p></div>`:''}
   ${G.zone==='delusion'?`<div class="hero-card"><p>זו רחוקה מדי. מה גרסה שכן אפשרית ב-12 שבועות?</p></div>`:''}`
   + cta('הלאה')} },

{ src:'תכנון חיים ומטרות · Your Best Year Ever, תרגיל 4 (מפתחות מוטיבציה)',
  view:()=>{const G=g();
   return head('הלמה','למה המטרה הזאת חשובה לך',
    'שלוש סיבות לפחות. אלה מה שתחזרי אליו כשההתלהבות תיגמר, וזה קורה בכל מחזור.')+
   G.why.map((w,k)=>`<div class="why-row"><span class="n">${k+1}</span>
     <div class="field"><input placeholder="${k?'סיבה נוספת':'הסיבה החזקה ביותר'}"
       value="${esc(w)}" oninput="g().why[${k}]=this.value"></div></div>`).join('')
   + cta('הלאה')} },

{ src:'תכנון חיים ומטרות · 12 Week Year, צעד 3 (מדדים מובילים)',
  view:()=>{const G=g();
   return head('הטקטיקות','אילו פעולות שבועיות יקדמו אותה',
    'לא התוצאה, הפעולות. את התוצאה לא תמיד שולטים בה. את הפעולות כן, וכאן נמדד הביצוע.')+
   G.tactics.map((t,k)=>`<div class="field"><label>פעולה ${k+1}</label>
     <input placeholder="למשל: לשלוח חמש הודעות ללקוחות" value="${esc(t)}"
       oninput="g().tactics[${k}]=this.value"></div>`).join('')+
   `<button class="text-link" onclick="g().tactics.push('');draw()">להוסיף פעולה</button>`
   + cta(gi<2?'המטרה הזאת מוכנה':'סיימתי את המטרות',
      gi<2?`<button class="cta secondary" onclick="doneGoals()">מספיק מטרות, להמשיך</button>`:'')} },

{ src:'הרגלים אטומיים · תרגיל 6 (הצהרת זהות)',
  view:()=>head('שלב 2 מתוך 4','מי את רוצה להיות',
    'לא מה להשיג, מי להיות. כל פעולה באפליקציה נספרת כקול אחד בעד המשפט הזה.')+`
  <div class="field"><label for="idn">אני אישה ש...</label>
    <input id="idn" placeholder="כותבת כל יום" value="${esc(S.identity)}"
      oninput="S.identity=this.value;draw()"></div>
  ${/\d|קילו|כסף|לקוחות/.test(S.identity)?
    `<div class="hero-card"><p>זו נשמעת כמו תוצאה. מי את צריכה להיות כדי שהיא תקרה?</p></div>`:''}`
  + cta('הלאה') },

{ src:'הרגלים אטומיים · חוק 3, תרגיל 5 (גרסת שתי הדקות)',
  view:()=>{const H=h();
   const tiny=H.behavior.trim()? [`${H.behavior} למשך שתי דקות`,`רק להתחיל את ${H.behavior}`,`להכין את מה שצריך ל${H.behavior}`]:[];
   return head(`הרגל ${hi+1} מתוך 3`,'איזה הרגל להכניס',
    'ואז מקטינים אותו עד שהוא לוקח פחות משתי דקות. בהתחלה המטרה היא להופיע, לא לעשות הרבה.')+`
   <div class="field"><label for="hb">ההרגל</label>
     <input id="hb" placeholder="למשל: לקרוא" value="${esc(H.behavior)}"
       oninput="h().behavior=this.value;draw()"></div>
   ${tiny.length?`<p class="subtitle">גרסאות של שתי דקות:</p><div class="tiny-opts">
     ${tiny.map(t=>`<button class="choice-card plain ${H.tiny===t?'selected':''}"
       onclick="h().tiny='${t.replace(/'/g,"\\'")}';draw()">
       <span class="card-text"><strong>${esc(t)}</strong></span></button>`).join('')}
     </div>`:''}
   <div class="field"><label for="ht">או בניסוח שלך</label>
     <input id="ht" placeholder="הגרסה הקטנה" value="${esc(H.tiny)}" oninput="h().tiny=this.value"></div>`
   + cta('הלאה')} },

{ src:'הרגלים אטומיים · תרגילים 2+3 (כוונת יישום ושרשור)',
  view:()=>{const H=h();
   return head(`הרגל ${hi+1} מתוך 3`,'מתי ואיפה בדיוק',
    'רוב האנשים חושבים שחסרה להם מוטיבציה. בפועל חסרה להם בהירות. הרמז הכי טוב הוא משהו שכבר קורה.')+`
   <div class="field"><label>אחרי מה שכבר קורה אצלך</label>
     <input placeholder="אחרי שאמזוג קפה בבוקר" value="${esc(H.anchor)}"
       oninput="h().anchor=this.value;draw()"></div>
   <div class="field"><label>באיזו שעה בערך</label>
     <input type="time" value="${H.time}" oninput="h().time=this.value;draw()"></div>
   ${H.anchor&&H.tiny?`<div class="contract">${esc(H.anchor)},<br>אני ${esc(H.tiny)}.</div>`:''}`
   + cta('הלאה')} },

{ src:'הרגלים אטומיים · חוק 4 (הפוך אותו למספק)',
  view:()=>{const H=h();
   const opts=['להגיד ״יש״ בקול','חיוך','אגרוף באוויר','לסמן וי ולהסתכל על השרשרת'];
   return head(`הרגל ${hi+1} מתוך 3`,'ואיך תסמני לעצמך שזה קרה',
    'החלק שהכי קל לוותר עליו, והוא זה שעובד. תגמול טוב מגיע מיד, לא בעוד חודש.')+`
   <div class="tiny-opts">${opts.map(o=>`<button class="choice-card plain ${H.celebration===o?'selected':''}"
     onclick="h().celebration='${o}';draw()"><span class="card-text"><strong>${o}</strong></span></button>`).join('')}</div>`
   + cta(hi<2?'ההרגל הזה מוכן':'סיימתי את ההרגלים',
      hi<2?`<button class="cta secondary" onclick="doneHabits()">מספיק הרגלים, להמשיך</button>`:'')} },

{ src:'חוק ה-5 שניות · תרגיל 3 (מיפוי הרגל רע)',
  view:()=>{const B=S.breakHabit||(S.breakHabit={what:'',trigger:'',instead:''});
   return head('אופציונלי','יש הרגל שאת רוצה להפסיק?',
    'לא מוחקים הרגל. מוצאים את התחושה שמפעילה אותו, ומחליפים את הפעולה באותו רגע.')+`
   <div class="field"><label>ההרגל</label>
     <input placeholder="לגלול בטלפון במיטה" value="${esc(B.what)}" oninput="S.breakHabit.what=this.value"></div>
   <div class="field"><label>התחושה שמפעילה אותו</label>
     <input placeholder="שעמום, לחץ, חרדה" value="${esc(B.trigger)}" oninput="S.breakHabit.trigger=this.value"></div>
   <div class="field"><label>מה במקום, אחרי 5-4-3-2-1</label>
     <input placeholder="שלוש נשימות ומשפט במחברת" value="${esc(B.instead)}" oninput="S.breakHabit.instead=this.value"></div>`
   + cta('הלאה', `<button class="cta secondary" onclick="S.breakHabit=null;next()">אין לי, לדלג</button>`)} },

{ src:'פרקטיקת בוקר · Miracle Morning, SAVERS',
  view:()=>{const M=S.morning;
   const S6=[['S','שקט','מדיטציה או נשימות'],['A','אישושים','משפטים מעצימים בקול'],
     ['V','דמיון','לראות את היום ואת המטרות'],['E','תנועה','מתיחות או הליכה'],
     ['R','קריאה','עשרה עמודים'],['S2','כתיבה','תודות, מחשבות, תובנות']];
   return head('שלב 3 מתוך 4','מה נכנס לבוקר שלך',
    'שש פרקטיקות. את בוחרת מה מהן שלך. אפשר להתחיל משלוש.')+`
   <div class="zones">${S6.map(([k,t,d])=>`<button class="choice-card plain ${M.savers.includes(k)?'selected':''}"
     onclick="tog('savers','${k}')"><span class="card-text"><strong>${t}</strong><span>${d}</span></span></button>`).join('')}</div>`
   + cta('הלאה')} },

{ src:'פרקטיקת בוקר · גרסת 6 הדקות',
  view:()=>{const M=S.morning;
   return head('שלב 3 מתוך 4','כמה זמן יש לך בבוקר',
    'עקביות מנצחת עוצמה. עדיף שש דקות כל יום מ-45 דקות פעם בשבוע.')+`
   <div class="pill-row">${[6,20,45].map(m=>`<button class="pill lg ${M.minutes===m?'active':''}"
     onclick="S.morning.minutes=${m};draw()">${m} דקות</button>`).join('')}</div>`
   + cta('הלאה')} },

{ src:'פרקטיקת בוקר · אלרוד, אסטרטגיית ההשכמה בת 5 השלבים',
  view:()=>{const M=S.morning;
   const W=[['a','להצהיר בלילה למה כדאי לקום מחר'],['b','להרחיק את השעון מהמיטה'],
     ['c','לצחצח שיניים ולשטוף פנים'],['d','כוס מים מלאה'],['e','להתלבש מיד']];
   return head('שלב 3 מתוך 4','איך את קמה',
    'כשהשעון מצלצל: 5-4-3-2-1, ורגליים על הרצפה. אלה הדברים שמורידים את המחיר של הקימה.')+`
   <div class="zones">${W.map(([k,t])=>`<button class="choice-card plain ${M.wakeSteps.includes(k)?'selected':''}"
     onclick="tog('wakeSteps','${k}')"><span class="card-text"><strong>${t}</strong></span></button>`).join('')}</div>`
   + cta('הלאה')} },

{ src:"פרקטיקת בוקר · The Artist's Way, Morning Pages ו-Artist Date",
  view:()=>{const M=S.morning;
   const D=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
   return head('שלב 3 מתוך 4','כתיבה חופשית ופגישת האמן',
    'עמוד אחד בבוקר, בלי לערוך ובלי לקרוא מחדש. ופעם בשבוע יציאה לבד, לא משימה ולא משהו מועיל.')+`
   <button class="choice-card plain ${M.pages?'selected':''}" onclick="S.morning.pages=!S.morning.pages;draw()">
     <span class="card-text"><strong>כתיבת בוקר יומית</strong><span>עמוד אחד, זרם חופשי</span></span></button>
   <p class="subtitle" style="margin-top:14px">היום הקבוע לפגישת האמן</p>
   <div class="pill-row">${D.map(d=>`<button class="pill ${M.artistDate===d?'active':''}"
     onclick="S.morning.artistDate='${d}';draw()">${d}</button>`).join('')}</div>`
   + cta('הלאה')} },

{ src:'תכנון חיים ומטרות · Full Focus, Weekly Big 3',
  view:()=>{
   const pool=S.goals.flatMap((G,k)=>G.tactics.filter(t=>t.trim()).map(t=>({t,goal:G.title||`מטרה ${k+1}`})));
   const sel=S.week.big3.map(b=>b.text);
   return head('שלב 4 מתוך 4','שלוש המשימות של השבוע',
    'לא רשימה חדשה. אלה הפעולות שכתבת תחת המטרות. בוחרים שלוש לשבוע הזה.')+
   (pool.length? `<div class="zones">${pool.map(p=>`
     <button class="choice-card plain ${sel.includes(p.t)?'selected':''}" onclick="pick('${p.t.replace(/'/g,"\\'")}')">
       <span class="card-text"><strong>${esc(p.t)}</strong><span>מתוך: ${esc(p.goal)}</span></span></button>`).join('')}</div>`
    : `<div class="hero-card"><p>לא נכתבו טקטיקות בשלב המטרות, אז אין מה לגזור. זה בדיוק המקום שבו הפלאוו נשבר היום.</p></div>`)+
   `<p class="subtitle" style="margin-top:12px">נבחרו ${S.week.big3.length} מתוך 3</p>`
   + cta('לסיים')} },

{ src:'סיכום · כל מה שנאסף עובר למסך היום שלי',
  view:()=>head('סיימנו','זה מה שתראי במסך היום שלי','כל נתון שנאסף כאן מופיע שם. שום שאלה לא נשאלה לחינם.')+`
  <div class="summary">
   <div class="sum-card"><h4>הזהות</h4><p>${esc(S.identity||'לא הוגדרה')}</p></div>
   <div class="sum-card"><h4>מטרות המחזור</h4><p>${S.goals.filter(x=>x.title).map(x=>esc(x.title)).join('<br>')||'לא הוגדרו'}</p></div>
   <div class="sum-card"><h4>שלוש המשימות של השבוע</h4><p>${S.week.big3.map(b=>esc(b.text)).join('<br>')||'לא נבחרו'}</p></div>
   <div class="sum-card"><h4>ההרגלים</h4><p>${S.habits.filter(x=>x.tiny).map(x=>esc(`${x.anchor||'?'} ← ${x.tiny}`)).join('<br>')||'לא הוגדרו'}</p></div>
   ${S.breakHabit&&S.breakHabit.what?`<div class="sum-card"><h4>הרגל להפסיק</h4><p>${esc(S.breakHabit.what)}</p></div>`:''}
   <div class="sum-card"><h4>שגרת הבוקר</h4><p>${S.morning.savers.length} מרכיבים · ${S.morning.minutes} דקות${S.morning.pages?' · כתיבת בוקר':''}</p></div>
  </div>` },
];

/* ── ניווט. הלולאות של המטרות וההרגלים ── */
function next(){
  if (i===4){ if(gi<2){ gi++; i=1; return draw(); } }        // סוף מטרה, חוזרים למטרה הבאה
  if (i===8){ if(hi<2){ hi++; i=6; return draw(); } }        // סוף הרגל, חוזרים להרגל הבא
  if (i<SCREENS.length-1) i++;
  draw();
}
function back(){ if(i>0){ i--; draw(); } }
function doneGoals(){ i=5; draw(); }
function doneHabits(){ i=9; draw(); }
function tog(k,v){ const a=S.morning[k]; const j=a.indexOf(v); j<0?a.push(v):a.splice(j,1); draw(); }
function pick(t){
  const j=S.week.big3.findIndex(b=>b.text===t);
  if(j>=0) S.week.big3.splice(j,1);
  else if(S.week.big3.length<3) S.week.big3.push({text:t,done:false});
  draw();
}
function draw(){
  const sc=SCREENS[i];
  /* כל הקשה מציירת את המסך מחדש, והשדה נהרס יחד עם הפוקוס והסמן.
     שומרים איפה היינו, ומחזירים אחרי הציור. 31.7 */
  const a=document.activeElement;
  const keep = a && a.closest && a.closest('#screen')
    ? { id:a.id, name:a.getAttribute('placeholder'), s:(()=>{try{return a.selectionStart}catch(e){return null}})() }
    : null;
  el('screen').innerHTML=sc.view();
  if (keep) {
    const back = keep.id ? el(keep.id)
      : document.querySelector(`#screen [placeholder="${(keep.name||'').replace(/"/g,'\\"')}"]`);
    if (back) {
      back.focus({preventScroll:true});
      if (keep.s !== null) { try { back.setSelectionRange(keep.s, keep.s); } catch(e){} }
    }
  }
  el('src').textContent='המקור: '+sc.src;
  el('pos').textContent=`מסך ${i+1} מתוך ${SCREENS.length}`;
  el('map').textContent='כל מסך מציג בתחתיתו מאיזה מדריך בוולט ומאיזה תרגיל בתוכו הוא נגזר. אפשר לפתוח את המדריך ולבדוק.';
}
el('prev').onclick=back;
el('restart').onclick=()=>{location.reload()};
draw();
</script>
</body>
