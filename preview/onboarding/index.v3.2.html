<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Day · Onboarding v3</title>

<!-- עובד גם בתוך המאגר וגם כקובץ Preview עצמאי -->
<link rel="stylesheet" href="../design/habit-flow.css">
<link rel="stylesheet" href="https://chen233153-source.github.io/my-day/preview/design/habit-flow.css">

<style>
  body { display:grid; place-items:center; min-height:100vh; overflow:auto; padding:20px; }
  .stage { display:grid; place-items:center; gap:14px; }
  .content { padding-bottom:74px; overflow-y:auto; overscroll-behavior:contain; }
  .preview-bar { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;
    font-size:13px; color:#6b6862; direction:rtl; }
  .preview-bar button { font:inherit; border:1px solid #e0ddd7; background:#fff;
    border-radius:999px; padding:6px 14px; cursor:pointer; }
  .preview-map { max-width:520px; font-size:12.5px; color:#6b6862; text-align:center; line-height:1.6; }
  .source-note { margin-top:14px; padding:10px 12px; border-radius:14px;
    color:color-mix(in oklch, var(--surface) 70%, transparent);
    background:color-mix(in oklch, var(--surface) 8%, transparent);
    border:1px solid color-mix(in oklch, var(--surface) 12%, transparent);
    font-size:11.5px; line-height:1.45; font-weight:650; }
  .hint { margin-top:10px; padding:11px 14px; border-radius:var(--radius);
    font-size:14px; font-weight:700; line-height:1.5;
    background:color-mix(in oklch, var(--surface) 14%, transparent);
    color:color-mix(in oklch, var(--surface) 88%, transparent); }
  .hint.warn { background:color-mix(in oklch, #ff7a7a 28%, transparent); color:var(--surface); }
  .zones { display:grid; gap:10px; }
  .stack { display:grid; gap:12px; }
  .compact { gap:8px; }
  .field + .field { margin-top:12px; }
  .field select {
    width:100%; border:0; border-radius:var(--radius);
    background:color-mix(in oklch, var(--surface) 14%, transparent);
    color:var(--surface); padding:15px 16px;
    outline:1px solid color-mix(in oklch, var(--surface) 18%, transparent);
    font-size:16px; font-weight:700;
  }
  .field select option { color:#1e1b2e; }
  .white-card .field label, .hero-card .field label { color:var(--fg); }
  .white-card .field input, .white-card .field select,
  .hero-card .field input, .hero-card .field select {
    background:#f2effa; color:var(--fg); outline:1px solid var(--border);
  }
  .white-card .field input::placeholder, .hero-card .field input::placeholder { color:#8b85a1; }
  .goal-chip { display:inline-flex; gap:6px; align-items:center; padding:6px 10px; border-radius:999px;
    background:color-mix(in oklch, var(--accent-secondary) 18%, var(--surface));
    color:var(--fg); font-size:12px; font-weight:800; }
  .summary-card { background:color-mix(in oklch, var(--surface) 13%, transparent);
    border:1px solid color-mix(in oklch, var(--surface) 20%, transparent);
    border-radius:var(--radius); padding:14px 16px; }
  .summary-card h4 { font-size:12.5px; font-weight:800; margin-bottom:8px;
    color:color-mix(in oklch, var(--surface) 68%, transparent); }
  .summary-row { display:flex; gap:10px; align-items:flex-start; padding:7px 0;
    font-size:15px; font-weight:700; color:var(--surface); }
  .summary-row i { width:19px; height:19px; border-radius:50%; flex:0 0 auto; margin-top:2px;
    border:1.6px solid color-mix(in oklch, var(--surface) 42%, transparent); }
  .summary-sub { display:block; font-size:12.5px; font-weight:600;
    color:color-mix(in oklch, var(--surface) 62%, transparent); }
  .module-row { display:grid; grid-template-columns:1fr 76px; gap:10px; align-items:end; }
  .module-row .field { margin:0; }
  .reorder { display:flex; gap:6px; margin-top:8px; }
  .reorder button { flex:1; min-height:38px; border:1px solid color-mix(in oklch, var(--surface) 18%, transparent);
    border-radius:12px; background:color-mix(in oklch, var(--surface) 10%, transparent);
    color:var(--surface); font-weight:800; cursor:pointer; }
  .progress-mini { display:flex; gap:5px; margin:0 0 18px; direction:ltr; }
  .progress-mini span { height:6px; flex:1; border-radius:999px;
    background:color-mix(in oklch, var(--surface) 18%, transparent); }
  .progress-mini span.done { background:var(--accent-secondary); }
  .cta[disabled] { opacity:.48; cursor:not-allowed; }
  .btn-row { margin-top:10px; }
  .day-hero { margin-bottom:12px; }
  .day-hero strong { font-size:18px; }
  .today-action { width:100%; margin-top:10px; }
  .micro { font-size:12px; color:color-mix(in oklch, var(--surface) 64%, transparent); line-height:1.5; }
  .divider { height:1px; background:color-mix(in oklch, var(--surface) 16%, transparent); margin:4px 0; }
  @media (max-width:430px) {
    body { padding:0; background:var(--bg); }
    .phone { width:100vw; height:100dvh; border-radius:0; box-shadow:none; }
    .preview-bar,.preview-map { display:none; }
  }
</style>
</head>

<body>
<div class="stage">
  <div class="phone"><div class="content" id="screen"></div></div>
  <div class="preview-bar">
    <button id="backOutside">חזרה</button>
    <span id="position"></span>
    <button id="restart">להתחיל מחדש</button>
  </div>
  <div class="preview-map">אב־טיפוס v3: הזרימה נשמרת מקומית בדפדפן, כך שאפשר לרענן ולהמשיך.</div>
</div>

<script>
const STORAGE_KEY = 'my-day-onboarding-v3-preview';

const DEFAULT_MORNING = {
  silence:      {label:'שקט',     description:'נשימות או מדיטציה קצרה', action:'שלוש נשימות איטיות', minutes:2},
  affirmations: {label:'אישושים', description:'משפטים שמחזקים את הכיוון שלך', action:'לקרוא את שלושת המשפטים שלי', minutes:2},
  visualize:    {label:'דמיון',   description:'לראות את היום ואת המטרה', action:'לדמיין את הפעולה החשובה הושלמה', minutes:2},
  exercise:     {label:'תנועה',   description:'להעיר את הגוף', action:'מתיחות קצרות', minutes:5},
  reading:      {label:'קריאה',   description:'ללמוד משהו קטן', action:'לקרוא שני עמודים', minutes:5},
  scribing:     {label:'כתיבה',   description:'תודות, מחשבות או תכנון', action:'לכתוב שלוש שורות', minutes:4}
};

const initialState = () => ({
  route:'intro',
  history:[],
  gi:0,
  hi:0,
  error:'',
  cycle:{start:new Date().toISOString().slice(0,10)},
  goals:[{title:'',metric:'',why:'',tactics:['','']}],
  habits:[{behavior:'',tiny:'',goalIndex:0,anchor:'',time:''}],
  breakHabit:null,
  morning:{selected:[],items:JSON.parse(JSON.stringify(DEFAULT_MORNING)),express:true},
  week:{big3:[]},
  eveningTime:'20:00'
});

let S = loadState();

function loadState(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? {...initialState(), ...JSON.parse(saved)} : initialState();
  } catch(e) { return initialState(); }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
function esc(v=''){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function el(id){ return document.getElementById(id); }
function goal(){ return S.goals[S.gi]; }
function habit(){ return S.habits[S.hi]; }
function clean(arr){ return arr.filter(x=>String(x||'').trim()); }
function source(text){ return `<div class="source-note">המקור: ${esc(text)}</div>`; }
function errorBox(){ return S.error ? `<div class="hint warn">${esc(S.error)}</div>` : ''; }
function clearError(){ S.error=''; }
function progress(n,total=12){
  return `<div class="progress-mini">${Array.from({length:total},(_,i)=>`<span class="${i<n?'done':''}"></span>`).join('')}</div>`;
}
function head(step,title,sub,progressStep){
  return `${progress(progressStep)}
  <div class="top-bar">
    <button class="back-btn" onclick="back()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="step-label">${esc(step)}</span>
  </div>
  <div class="heading"><h1>${esc(title)}</h1>${sub?`<p class="subtitle">${esc(sub)}</p>`:''}</div>`;
}
function cta(label, action='advance()', secondary=''){
  return `<div class="bottom">${errorBox()}
    <button class="cta" onclick="${action}">${esc(label)}</button>
    ${secondary}
  </div>`;
}
function snapshot(){
  return {route:S.route, gi:S.gi, hi:S.hi};
}
function go(route){
  S.history.push(snapshot());
  S.route=route; S.error=''; save(); draw();
}
function back(){
  const prev=S.history.pop();
  if(!prev) return;
  S.route=prev.route; S.gi=prev.gi; S.hi=prev.hi; S.error=''; save(); draw();
}
function setVal(path, value){
  const parts=path.split('.');
  let obj=S;
  for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  obj[parts.at(-1)]=value;
  save();
}
function validate(condition, message){
  if(condition) return true;
  S.error=message; draw(); return false;
}

/* הצעה מקומית בלבד. בגרסה האמיתית היועצת יכולה לדייק לפי המדריכים. */
const SHRINK=[
 [/קרי?א|ספר|לקרוא/,'לקרוא שני עמודים'],
 [/כתיב|לכתוב|יומן/,'לכתוב שורה אחת'],
 [/ריצ|לרוץ|הליכ|ללכת|צע(ד|ו)/,'לצאת לעשר דקות'],
 [/כושר|אימון|מתיח|יוגה|שכיבות/,'לעשות סט אחד'],
 [/מדיטצ|נשימ|שקט/,'לעשות שתי דקות'],
 [/מים|לשתות/,'לשתות כוס אחת'],
 [/לימוד|ללמוד|קורס/,'לראות סרטון אחד']
];
function shrinkFor(text){
  for(const [re,v] of SHRINK) if(re.test(text)) return v;
  return '';
}

function advance(){
  clearError();
  const r=S.route;
  if(r==='intro') return go('goal');
  if(r==='goal'){
    const G=goal();
    if(!validate(G.title.trim().length>=3,'כתבי מטרה ברורה לפני שממשיכים.')) return;
    if(!validate(G.metric.trim().length>=1,'הוסיפי סימן או מספר שיעזור לדעת שהמטרה הושגה.')) return;
    return go('goalPlan');
  }
  if(r==='goalPlan'){
    const G=goal();
    if(!validate(G.why.trim().length>=3,'כתבי למה המטרה חשובה לך.')) return;
    if(!validate(clean(G.tactics).length>=1,'הוסיפי לפחות פעולה שבועית אחת.')) return;
    return go('goalsDecision');
  }
  if(r==='habit'){
    const H=habit();
    if(!validate(H.behavior.trim().length>=2,'כתבי את ההרגל שתרצי לבנות.')) return;
    if(!validate(H.tiny.trim().length>=2,'הגדירי גרסה קטנה שאפשר לבצע גם ביום עמוס.')) return;
    return go('habitAnchor');
  }
  if(r==='habitAnchor'){
    const H=habit();
    if(!validate(H.anchor.trim().length>=2,'בחרי עוגן שכבר קורה בשגרה שלך.')) return;
    return go('habitsDecision');
  }
  if(r==='breakHabit') return go('morningPick');
  if(r==='morningPick'){
    if(!validate(S.morning.selected.length>=1,'בחרי לפחות מרכיב אחד לשגרת הבוקר.')) return;
    return go('morningBuild');
  }
  if(r==='morningBuild') return go('week');
  if(r==='week'){
    if(!validate(S.week.big3.length>=1,'בחרי לפחות פעולה אחת לשבוע הראשון.')) return;
    return go('evening');
  }
  if(r==='evening') return go('done');
}

function addGoal(){
  if(S.goals.length>=3) return go('habit');
  S.goals.push({title:'',metric:'',why:'',tactics:['','']});
  S.gi=S.goals.length-1; save(); go('goal');
}
function continueToHabits(){ S.gi=0; go('habit'); }
function addHabit(){
  if(S.habits.length>=3) return go('breakHabit');
  S.habits.push({behavior:'',tiny:'',goalIndex:0,anchor:'',time:''});
  S.hi=S.habits.length-1; save(); go('habit');
}
function continueAfterHabits(){ go('breakHabit'); }
function skipBreak(){ S.breakHabit=null; save(); go('morningPick'); }
function ensureBreak(){
  if(!S.breakHabit) S.breakHabit={what:'',trigger:'',instead:''};
}
function toggleMorning(key){
  const a=S.morning.selected;
  const i=a.indexOf(key);
  i>=0 ? a.splice(i,1) : a.push(key);
  save(); draw();
}
function moveMorning(key,delta){
  const a=S.morning.selected;
  const i=a.indexOf(key), j=i+delta;
  if(i<0||j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]];
  save(); draw();
}
function toggleBig3(text,goalIndex){
  const i=S.week.big3.findIndex(x=>x.text===text && x.goalIndex===goalIndex);
  if(i>=0) S.week.big3.splice(i,1);
  else if(S.week.big3.length<3) S.week.big3.push({text,goalIndex,done:false});
  save(); draw();
}

function toggleBig3FromButton(button){
  const text = button.dataset.task || '';
  const goalIndex = Number(button.dataset.goalIndex);
  toggleBig3(text, goalIndex);
}
function restart(){
  localStorage.removeItem(STORAGE_KEY);
  S=initialState(); draw();
}

const views = {
intro(){
  return `${head('פתיחת מחזור','12 שבועות. כיוון אחד ברור.',
    'נגדיר עד שלוש מטרות, נבנה הרגלים ושגרת בוקר, ונבחר את הפעולות של השבוע הראשון.',1)}
    <div class="hero-card">
      <strong>מה ייצא לך בסוף?</strong>
      <p>מסך “היום שלי” שמחבר בין המטרות הגדולות לבין הצעד הבא שאפשר לבצע עכשיו.</p>
    </div>
    ${source('תכנון חיים ומטרות · The 12 Week Year, קיצור האופק ותכנון מחזור')}
    ${cta('להתחיל את המחזור')}`;
},
goal(){
  const G=goal();
  return `${head(`מטרה ${S.gi+1} מתוך עד 3`,'מה את רוצה שיקרה',
    'נסחי תוצאה שאפשר לזהות בסוף 12 השבועות. אחר כך נוסיף לה מדד.',2)}
    <div class="field"><label>המטרה</label>
      <input placeholder="למשל: להשיק את גרסת האפליקציה הראשונה"
        value="${esc(G.title)}" oninput="goal().title=this.value; clearError(); save()"></div>
    <div class="field"><label>איך תדעי שהיא הושגה</label>
      <input placeholder="למשל: גרסה עובדת עם 5 משתמשות בדיקה"
        value="${esc(G.metric)}" oninput="goal().metric=this.value; clearError(); save()"></div>
    ${source('תכנון חיים ומטרות · SMARTER + מטרות ל־12 שבועות')}
    ${cta('להמשיך')}`;
},
goalPlan(){
  const G=goal();
  return `${head(`מטרה ${S.gi+1}`,'למה, ואיך מתקדמים אליה',
    'הסיבה תחזיר אותך למסלול. הפעולות השבועיות יהפכו בהמשך לתוכנית השבוע.',3)}
    <div class="field"><label>למה זה חשוב לך</label>
      <textarea placeholder="מה ישתנה בחיים שלך כשהמטרה תושג?"
        oninput="goal().why=this.value; clearError(); save()">${esc(G.why)}</textarea></div>
    <div class="stack">
      ${G.tactics.map((t,k)=>`<div class="field"><label>פעולה שבועית ${k+1}</label>
        <input placeholder="למשל: שתי שעות עבודה ממוקדת"
          value="${esc(t)}" oninput="goal().tactics[${k}]=this.value; clearError(); save()"></div>`).join('')}
    </div>
    <button class="text-link" onclick="goal().tactics.push('');save();draw()">להוסיף פעולה שבועית</button>
    ${source('תכנון חיים ומטרות · מפתחות מוטיבציה + מדדים מובילים')}
    ${cta('המטרה מוכנה')}`;
},
goalsDecision(){
  const goals=S.goals.filter(g=>g.title.trim());
  return `${head('המטרות שלך','יש כיוון למחזור',
    'אפשר להוסיף עוד מטרה, עד שלוש. פחות מטרות פירושו יותר פוקוס.',3)}
    <div class="zones">${goals.map((g,k)=>`<div class="summary-card">
      <h4>מטרה ${k+1}</h4><div class="summary-row"><i></i><span>${esc(g.title)}
      <span class="summary-sub">${esc(g.metric)}</span></span></div></div>`).join('')}</div>
    ${source('תכנון חיים ומטרות · עד שלוש מטרות למחזור')}
    <div class="bottom">
      <button class="cta" onclick="${S.goals.length<3?'addGoal()':'continueToHabits()'}">${S.goals.length<3?'להוסיף עוד מטרה':'לעבור להרגלים'}</button>
      ${S.goals.length<3?`<button class="cta secondary" onclick="continueToHabits()">מספיק מטרות, להמשיך</button>`:''}
    </div>`;
},
habit(){
  const H=habit(), suggestion=shrinkFor(H.behavior);
  const goalOptions=S.goals.map((g,k)=>`<option value="${k}" ${Number(H.goalIndex)===k?'selected':''}>${esc(g.title||`מטרה ${k+1}`)}</option>`).join('');
  return `${head(`הרגל ${S.hi+1} מתוך עד 3`,'איזה הרגל יתמוך במטרה',
    'ההרגל לא עומד לבד. הוא מחובר למטרה, ומתחיל בגרסה קטנה.',4)}
    <div class="field"><label>לאיזו מטרה הוא קשור</label>
      <select onchange="habit().goalIndex=Number(this.value); save()">${goalOptions}</select></div>
    <div class="field"><label>ההרגל המלא</label>
      <input placeholder="למשל: לעבוד על האפליקציה"
        value="${esc(H.behavior)}" oninput="habit().behavior=this.value; clearError(); save()"></div>
    <div class="field"><label>הגרסה הקטנה</label>
      <input placeholder="${esc(suggestion||'משהו שאפשר לעשות גם ביום קשה')}"
        value="${esc(H.tiny)}" oninput="habit().tiny=this.value; clearError(); save()"></div>
    ${suggestion&&!H.tiny.trim()?`<div class="hint">הצעה: <b>${esc(suggestion)}</b>
      <button class="text-link" onclick="habit().tiny='${esc(suggestion)}';save();draw()">לקחת את ההצעה</button></div>`:''}
    ${source('הרגלים אטומיים · שינוי מבוסס זהות + חוק שתי הדקות')}
    ${cta('להמשיך')}`;
},
habitAnchor(){
  const H=habit();
  const G=S.goals[H.goalIndex]||S.goals[0];
  return `${head(`הרגל ${S.hi+1}`,'מתי הוא קורה',
    'עוגן קיים נותן להרגל רגע ברור במקום לחכות למוטיבציה.',5)}
    <div class="field"><label>אחרי מה שכבר קורה</label>
      <input placeholder="למשל: אחרי שאכין קפה"
        value="${esc(H.anchor)}" oninput="habit().anchor=this.value; clearError(); save()"></div>
    <div class="field"><label>שעה משוערת, אופציונלי</label>
      <input type="time" value="${esc(H.time)}" oninput="habit().time=this.value; save()"></div>
    ${H.anchor&&H.tiny?`<div class="white-card"><div class="contract">
      <span>${esc(H.anchor)},</span><span>אני ${esc(H.tiny)}.</span>
      <small>זה תומך ב: ${esc(G?.title||'המטרה שלי')}</small>
    </div></div>`:''}
    ${source('הרגלים אטומיים · כוונת יישום + שרשור הרגלים')}
    ${cta('ההרגל מוכן')}`;
},
habitsDecision(){
  const habits=S.habits.filter(h=>h.behavior.trim());
  return `${head('ההרגלים שלך','המערכת מתחילה להיבנות',
    'אפשר להוסיף עד שלושה הרגלים. כל אחד צריך להקל על ההתקדמות, לא להעמיס.',5)}
    <div class="zones">${habits.map((h,k)=>{
      const g=S.goals[h.goalIndex];
      return `<div class="summary-card"><h4>הרגל ${k+1}</h4>
        <div class="summary-row"><i></i><span>${esc(h.tiny||h.behavior)}
        <span class="summary-sub">${esc(h.anchor)} · ${esc(g?.title||'')}</span></span></div></div>`;
    }).join('')}</div>
    ${source('הרגלים אטומיים · מערכת התנהגות קטנה ועקבית')}
    <div class="bottom">
      <button class="cta" onclick="${S.habits.length<3?'addHabit()':'continueAfterHabits()'}">${S.habits.length<3?'להוסיף עוד הרגל':'להמשיך'}</button>
      ${S.habits.length<3?`<button class="cta secondary" onclick="continueAfterHabits()">מספיק הרגלים, להמשיך</button>`:''}
    </div>`;
},
breakHabit(){
  ensureBreak();
  const B=S.breakHabit;
  return `${head('אופציונלי','יש הרגל אחד שתרצי להפחית?',
    'כאן מגדירים רק את הטריגר והחלופה. את המיפוי המלא עושים בזמן שההרגל באמת מופיע.',6)}
    <div class="field"><label>ההרגל</label>
      <input placeholder="למשל: לגלול בטלפון במיטה"
        value="${esc(B.what)}" oninput="S.breakHabit.what=this.value; save()"></div>
    <div class="field"><label>מה בדרך כלל מפעיל אותו</label>
      <input placeholder="שעמום, לחץ, עייפות"
        value="${esc(B.trigger)}" oninput="S.breakHabit.trigger=this.value; save()"></div>
    <div class="field"><label>מה תעשי במקום</label>
      <input placeholder="למשל: שלוש נשימות ומשפט במחברת"
        value="${esc(B.instead)}" oninput="S.breakHabit.instead=this.value; save()"></div>
    ${source('הרגלים אטומיים · היפוך ארבעת החוקים; המיפוי המלא יופעל בזמן אמת')}
    ${cta('להמשיך','advance()',`<button class="cta secondary" onclick="skipBreak()">לדלג</button>`)}`;
},
morningPick(){
  const cards=Object.entries(DEFAULT_MORNING).map(([key,m])=>`
    <button class="choice-card plain ${S.morning.selected.includes(key)?'selected':''}" onclick="toggleMorning('${key}')">
      <span class="card-text"><strong>${esc(m.label)}</strong><span>${esc(m.description)}</span></span>
    </button>`).join('');
  return `${head('שגרת בוקר','מה באמת שייך לבוקר שלך',
    'לא חייבים לבחור את כל ששת המרכיבים. בוחרים רק מה שנרצה להפעיל בפועל.',7)}
    <div class="zones">${cards}</div>
    ${source('פרקטיקת בוקר ושחרור יצירתי · SAVERS')}
    ${cta('לבנות את השגרה')}`;
},
morningBuild(){
  const selected=S.morning.selected;
  const total=selected.reduce((sum,k)=>sum+Number(S.morning.items[k].minutes||0),0);
  return `${head('שגרת בוקר','מה עושים, ובאיזה סדר',
    `השגרה הרגילה שלך כרגע אורכת כ־${total} דקות.`,8)}
    <div class="stack">${selected.map((key,index)=>{
      const m=S.morning.items[key];
      return `<div class="summary-card">
        <h4>${index+1}. ${esc(m.label)}</h4>
        <div class="module-row">
          <div class="field"><label>מה בדיוק תעשי</label>
            <input value="${esc(m.action)}" oninput="S.morning.items['${key}'].action=this.value;save()"></div>
          <div class="field"><label>דקות</label>
            <input type="number" min="1" max="60" value="${esc(m.minutes)}"
              oninput="S.morning.items['${key}'].minutes=Math.max(1,Number(this.value)||1);save()"></div>
        </div>
        <div class="reorder">
          <button onclick="moveMorning('${key}',-1)" ${index===0?'disabled':''}>למעלה</button>
          <button onclick="moveMorning('${key}',1)" ${index===selected.length-1?'disabled':''}>למטה</button>
        </div>
      </div>`;
    }).join('')}</div>
    <div class="hint">בימים עמוסים האפליקציה תציע גרסת Express: דקה אחת מכל מרכיב שבחרת.</div>
    ${source('פרקטיקת בוקר ושחרור יצירתי · התאמת SAVERS + גרסת 6 הדקות')}
    ${cta('השגרה מוכנה')}`;
},
week(){
  const pool=[];
  S.goals.forEach((g,goalIndex)=>clean(g.tactics).forEach(text=>pool.push({text,goalIndex})));
  return `${head('השבוע הראשון','מה שלוש התוצאות החשובות עכשיו',
    'לא כותבים רשימה חדשה. בוחרים מתוך הפעולות שכבר חיברת למטרות.',9)}
    <div class="zones">${pool.map(p=>{
      const selected=S.week.big3.some(x=>x.text===p.text&&x.goalIndex===p.goalIndex);
      return `<button class="choice-card plain ${selected?'selected':''}"
        data-task="${esc(p.text)}" data-goal-index="${p.goalIndex}"
        onclick="toggleBig3FromButton(this)">
        <span class="card-text"><strong>${esc(p.text)}</strong><span>מתוך: ${esc(S.goals[p.goalIndex].title)}</span></span>
      </button>`;
    }).join('')}</div>
    <p class="subtitle" style="margin-top:12px">נבחרו ${S.week.big3.length} מתוך 3</p>
    ${source('תכנון חיים ומטרות · Weekly Big 3 + מדדים מובילים')}
    ${cta('להמשיך')}`;
},
evening(){
  return `${head('סגירת היום','מתי נוח לך לעצור לרגע',
    'השעה הזאת תשמש לתזכורת שקטה לסיכום יום ולבחירת הפעולה החשובה למחר.',10)}
    <div class="white-card">
      <div class="field"><label>שעת הסקירה בערב</label>
        <input type="time" value="${esc(S.eveningTime)}"
          oninput="S.eveningTime=this.value;save()"></div>
    </div>
    <div class="hint">אפשר לשנות את השעה בכל רגע בהגדרות.</div>
    ${source('תכנון חיים ומטרות · Rituals + סגירה יומית; משולב מהגרסה הראשונה')}
    ${cta('לראות את היום שלי')}`;
},
done(){
  const goalsCount=S.goals.filter(g=>g.title.trim()).length;
  const habitsCount=S.habits.filter(h=>h.tiny.trim()).length;
  const tasksCount=S.week.big3.length;
  const morningCount=S.morning.selected.length;

  return `${head('הכול מוכן','סיימנו להגדיר את המחזור שלך',
    'המטרות, ההרגלים, שגרת הבוקר והשבוע הראשון מוכנים. מכאן ממשיכים למסך הראשי.',12)}

    <div class="hero-card">
      <strong>מחזור 12 השבועות שלך מוכן</strong>
      <p>לא צריך לזכור הכול עכשיו. במסך הראשי תראי בכל פעם רק את מה שרלוונטי להיום.</p>
    </div>

    <div class="summary-card">
      <h4>מה הוגדר</h4>
      <div class="summary-row"><i></i><span>${goalsCount} מטרות למחזור</span></div>
      <div class="summary-row"><i></i><span>${habitsCount} הרגלים תומכים</span></div>
      <div class="summary-row"><i></i><span>${morningCount} מרכיבים בשגרת הבוקר</span></div>
      <div class="summary-row"><i></i><span>${tasksCount} פעולות לשבוע הראשון</span></div>
      <div class="summary-row"><i></i><span>סקירת ערב בשעה ${esc(S.eveningTime)}</span></div>
    </div>

    <div class="hint">אפשר לשנות כל פרט בהמשך. אין צורך להתחיל מושלם — רק להתחיל מהצעד הראשון.</div>

    ${source('סיום ה־Onboarding · מעבר למסך הראשי הקיים')}

    <div class="bottom">
      <button class="cta"
        onclick="window.location.href='https://chen233153-source.github.io/my-day/'">
        לעבור למסך הראשי
      </button>
    </div>`;
}
};

function draw(){
  save();
  const view=views[S.route]||views.intro;
  el('screen').innerHTML=view();
  const labels={
    intro:'פתיחה',goal:'מטרות',goalPlan:'תכנון מטרה',goalsDecision:'סיכום מטרות',
    habit:'הרגלים',habitAnchor:'עוגן',habitsDecision:'סיכום הרגלים',
    breakHabit:'הרגל להפחתה',morningPick:'בחירת בוקר',morningBuild:'בניית בוקר',
    week:'השבוע הראשון',evening:'שעת ערב',done:'סיום'
  };
  el('position').textContent=labels[S.route]||'';
  el('backOutside').disabled=S.history.length===0;
  requestAnimationFrame(()=>{ el('screen').scrollTop=0; });
}
el('backOutside').onclick=back;
el('restart').onclick=restart;
draw();
</script>
</body>
</html>
